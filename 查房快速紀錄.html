<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>查房快速紀錄 · ROS / PE Rounding Note</title>
<style>
  :root{
    --bg:#eef2f4; --surface:#ffffff; --ink:#12303d; --ink2:#3d5a67;
    --muted:#6f8794; --line:#d6e0e4; --line2:#e7eef1;
    --primary:#0e6b7a; --primary-d:#0a5460; --primary-soft:#e0f0f2;
    --pos:#b45309; --pos-bg:#fdf3e3; --pos-line:#e8b878;
    --focus:#0e6b7a; --focus-bg:#eef7f8; --focus-line:#9bcfd6;
    --danger:#b02a37;
    --radius:12px; --radius-s:9px;
    --shadow:0 1px 2px rgba(18,48,61,.06),0 6px 20px rgba(18,48,61,.06);
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}
  .wrap{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg)}

  /* ---------- top bars ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);
    backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);
    padding:10px 14px;display:flex;align-items:center;gap:10px}
  .topbar .grow{flex:1;min-width:0}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:9px 13px;border-radius:var(--radius-s);font-size:14px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:active{background:var(--primary-d)}
  .btn.ghost{border-color:transparent;background:transparent;padding:8px 8px}
  .btn.sm{padding:6px 10px;font-size:13px}

  /* ---------- patient list ---------- */
  .hero{padding:26px 18px 10px}
  .hero h1{margin:0;font-size:22px;letter-spacing:.5px;font-weight:800;color:var(--ink)}
  .hero p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
  .list{padding:8px 14px 90px}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 14px;margin:10px 0;display:flex;align-items:center;gap:12px}
  .pcard:active{border-color:var(--primary)}
  .pcard .pc-main{flex:1;min-width:0}
  .pc-code{font-weight:800;font-size:17px;letter-spacing:.4px;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .pc-meta{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .spec-badge{background:var(--primary-soft);color:var(--primary-d);border-radius:20px;
    padding:2px 10px;font-size:12px;font-weight:700}
  .pc-del{border:none;background:transparent;color:var(--muted);font-size:20px;
    width:36px;height:36px;border-radius:8px;line-height:1}
  .pc-del:active{background:#f4d9dc;color:var(--danger)}
  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  .empty .em-ic{font-size:40px;opacity:.5}

  /* new patient form */
  .newform{background:var(--surface);border:1px dashed var(--primary);border-radius:var(--radius);
    padding:16px 14px;margin:10px 0}
  .newform h3{margin:0 0 12px;font-size:15px;color:var(--primary-d)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:var(--radius-s);background:#fff;color:var(--ink)}
  .newform .row{display:flex;gap:10px}
  .newform .row .btn{flex:1;justify-content:center}

  /* fab */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;
    background:var(--primary);color:#fff;border:none;border-radius:26px;
    padding:14px 22px;font-size:15px;font-weight:700;box-shadow:0 6px 22px rgba(14,107,122,.4);
    display:inline-flex;gap:8px;align-items:center}
  .fab:active{background:var(--primary-d)}

  /* ---------- note view ---------- */
  .note-sub{padding:10px 14px 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .note-sub .pcode{font-weight:800;font-size:16px;letter-spacing:.4px}
  .specsel{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-s);
    background:#fff;color:var(--ink);font-weight:600;font-size:13.5px}
  .summary{padding:0 14px 6px;color:var(--muted);font-size:12.5px}
  .summary b{color:var(--pos)}

  .note-body{padding:6px 12px 120px}
  .section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
  .section.focus{border-color:var(--focus-line);background:var(--focus-bg)}
  .sec-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
  .sec-head .st{flex:1;font-weight:800;font-size:14.5px;letter-spacing:.3px}
  .sec-head .kindtag{font-size:11px;font-weight:800;color:var(--muted);
    border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .section.focus .sec-head .st{color:var(--focus)}
  .focus-flag{font-size:11px;font-weight:800;color:#fff;background:var(--focus);
    border-radius:6px;padding:2px 8px}
  .cnt{font-size:12px;font-weight:800;color:var(--pos);background:var(--pos-bg);
    border:1px solid var(--pos-line);border-radius:20px;padding:1px 9px;min-width:22px;text-align:center}
  .cnt.zero{display:none}
  .chev{color:var(--muted);transition:transform .18s;font-size:13px}
  .section.collapsed .sec-body{display:none}
  .section.collapsed .chev{transform:rotate(-90deg)}
  .sec-body{border-top:1px solid var(--line2);padding:6px 0}
  .secnote-btn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;
    width:30px;height:30px;font-size:13px;line-height:1;flex:none;padding:0}
  .secnote-btn.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-d)}
  .section.focus .secnote-btn{border-color:var(--focus-line)}
  .blocknote-wrap{display:none;padding:8px 14px 2px}
  .blocknote-wrap.show{display:block}
  .blocknote-input{width:100%;padding:9px 11px;border:1px solid var(--primary);border-radius:9px;
    background:#fbfdfd;color:var(--ink);font-size:13.5px}

  /* item */
  .item{padding:9px 14px;border-bottom:1px solid var(--line2)}
  .item:last-child{border-bottom:none}
  .item-row{display:flex;align-items:center;gap:10px}
  .item-label{flex:1;line-height:1.25;min-width:0}
  .item-label .lab-en{font-size:15.5px;font-weight:600;color:var(--ink);letter-spacing:.1px}
  .item-label .lab-zh{display:block;font-size:11px;font-weight:400;color:var(--muted);opacity:.85;margin-top:1px}
  .star{color:var(--pos);font-weight:800;margin-left:3px;font-size:13px}
  /* section title en/zh */
  .st-en{font-weight:800;font-size:14.5px;letter-spacing:.2px}
  .st-zh{font-weight:500;font-size:11px;color:var(--muted);opacity:.9;margin-left:7px}
  .section.focus .st-zh{opacity:.85}

  /* toggle pill */
  .toggle{border:1.5px solid var(--line);background:#fff;color:var(--muted);
    border-radius:22px;padding:6px 15px;font-size:13.5px;font-weight:800;min-width:64px;text-align:center}
  .toggle .neg{color:var(--muted)}
  .toggle.on{background:var(--pos-bg);border-color:var(--pos-line);color:var(--pos)}
  .item.hit{background:var(--pos-bg)}
  .item.hit .lab-en{color:var(--pos)}

  .isel{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-s);
    background:#fff;color:var(--ink);font-weight:600;font-size:13.5px;max-width:56%}
  .isel.abn{border-color:var(--pos-line);background:var(--pos-bg);color:var(--pos)}

  .notebtn{border:1px solid var(--line);background:#fff;color:var(--muted);
    border-radius:8px;width:34px;height:34px;font-size:15px;line-height:1;flex:none}
  .notebtn.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-d)}

  .subwrap{margin-top:9px;padding-left:2px;display:none;flex-direction:column;gap:8px}
  .subwrap.show{display:flex}
  .subrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sublab{font-size:12.5px;color:var(--ink2);font-weight:700;min-width:52px}
  .subsel{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
  .subtext,.itemnote{width:100%;padding:9px 11px;border:1px solid var(--line);
    border-radius:var(--radius-s);background:#fbfdfd;color:var(--ink);font-size:13.5px}
  .itemnote{margin-top:8px;display:none}
  .itemnote.show{display:block}

  .grpwrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grpfield{display:flex;align-items:center;gap:4px}
  .grpfield span{font-size:12px;color:var(--muted);font-weight:700}
  .grpfield select{padding:6px 7px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff}
  .grpfield select.abn{border-color:var(--pos-line);background:var(--pos-bg);color:var(--pos)}
  .grptotal{font-size:12.5px;font-weight:800;color:var(--ink2);margin-left:2px}
  .grptotal.abn{color:var(--pos)}

  .gnote{margin:14px 12px 0}
  .gnote label{display:block;font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:6px}
  .gnote textarea{width:100%;min-height:90px;padding:12px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--surface);color:var(--ink);resize:vertical;box-shadow:var(--shadow)}

  /* export menu */
  .menu{position:absolute;top:52px;right:12px;z-index:60;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:0 10px 34px rgba(18,48,61,.18);padding:6px;display:none;min-width:230px}
  .menu.show{display:block}
  .menu button{display:block;width:100%;text-align:left;border:none;background:transparent;
    padding:11px 12px;border-radius:8px;font-size:13.5px;color:var(--ink);font-weight:600}
  .menu button:active{background:var(--primary-soft)}
  .menu .mlabel{font-size:11px;color:var(--muted);font-weight:800;padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.5px}
  .menu .mdiv{height:1px;background:var(--line2);margin:5px 4px}
  .scrim{position:fixed;inset:0;z-index:55;display:none}
  .scrim.show{display:block}

  /* ---- export preview modal ---- */
  .modal{position:fixed;inset:0;z-index:70;display:none;background:rgba(18,48,61,.45);
    align-items:flex-end;justify-content:center;padding:0}
  .modal.show{display:flex}
  .modal-card{background:#fff;width:100%;max-width:760px;max-height:92vh;border-radius:16px 16px 0 0;
    display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(18,48,61,.3)}
  @media(min-width:620px){ .modal{align-items:center;padding:20px} .modal-card{border-radius:16px;max-height:88vh} }
  .modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .modal-head .mt{flex:1;font-weight:800;font-size:15px}
  .modal-head .mx{border:none;background:transparent;font-size:22px;color:var(--muted);width:38px;height:38px;border-radius:9px;line-height:1}
  .modal-head .mx:active{background:var(--line2)}
  .modal-scroll{flex:1;overflow:auto;padding:16px;background:#f6f9fa}
  .modal-foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .modal-foot .btn{flex:1;justify-content:center;min-width:120px}
  .txtprev{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang TC","Noto Sans TC",monospace;
    font-size:12.5px;line-height:1.6;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
  /* on-screen document preview (mirrors print) */
  .docprev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;color:#111}
  .docprev .pr-h{border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}
  .docprev .pr-h h1{font-size:18px;margin:0 0 4px}
  .docprev .pr-meta{font-size:12.5px;color:#444}
  .docprev .pr-sec{margin:0 0 12px}
  .docprev .pr-sec h2{font-size:14px;margin:0 0 4px;padding:3px 0;border-bottom:1px solid #bbb}
  .docprev .pr-line{font-size:12.5px;padding:2px 0;line-height:1.5}
  .docprev .pr-line .k{font-weight:700}
  .docprev .pr-line i{color:var(--pos);font-style:normal}
  .docprev .pr-note{white-space:pre-wrap;font-size:12.5px;border:1px solid #bbb;padding:8px;border-radius:6px}

  .hidden{display:none!important}

  /* toast */
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;
    font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* print */
  #printArea{display:none}
  @media print{
    body{background:#fff}
    .wrap>*{display:none!important}
    #printArea{display:block!important;padding:0;color:#000}
    .pr-h{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
    .pr-h h1{font-size:19px;margin:0 0 4px}
    .pr-meta{font-size:12.5px;color:#333}
    .pr-sec{margin:0 0 12px;break-inside:avoid}
    .pr-sec h2{font-size:14px;margin:0 0 4px;padding:3px 0;border-bottom:1px solid #999}
    .pr-line{font-size:12.5px;padding:2px 0;line-height:1.45}
    .pr-line .k{font-weight:700}
    .pr-line.pos .k{color:#000}
    .pr-note{white-space:pre-wrap;font-size:12.5px;border:1px solid #999;padding:8px;border-radius:6px}
    @page{margin:14mm}
  }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="exportModal">
  <div class="modal-card">
    <div class="modal-head">
      <span class="mt" id="modalTitle">匯出預覽</span>
      <button class="mx" id="modalClose" title="關閉">×</button>
    </div>
    <div class="modal-scroll" id="modalScroll"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div id="printArea"></div>

<script>
"use strict";
/* =======================================================================
   查房快速紀錄 ROS / PE Rounding Note  ── 單檔應用
   資料以 localStorage 自動儲存；下載後用瀏覽器開啟即可離線使用。
   ======================================================================= */

/* ---------- 儲存層（雙模式）----------
   在 Claude artifact 內：用 window.storage（每位觀看者各自持久化，跨 session 保留）
   下載成檔 / 自架網站：用 localStorage（每台裝置各自持久化）
   兩者都不可用：記憶體（重整即清空）
------------------------------------------------ */
const KEY = "rounding_notes_v1";
const mem = {data:null};
const hasWinStore = (typeof window!=="undefined" && window.storage && typeof window.storage.get==="function");
const Store = {
  async read(){
    if(hasWinStore){
      try{ const r=await window.storage.get(KEY, false); return (r&&r.value)?JSON.parse(r.value):null; }
      catch(e){ return null; }  // 不存在的 key 會 throw，視為 null
    }
    try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }
    catch(e){ return mem.data; }
  },
  write(v){
    mem.data = v;
    if(hasWinStore){ try{ window.storage.set(KEY, JSON.stringify(v), false); }catch(e){} return; }
    try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){}
  }
};

/* ---------- 建構小工具 ---------- */
// toggle：預設 negative；fu = follow-up 陣列（勾陽性才展開）
function T(id,label,en,star,fu){ return {id,kind:"",system:"",type:"toggle",label,en:en||"",star:!!star,fu:fu||null}; }
// select：下拉；opts 字串陣列（第一項固定為未評估）；normal=正常值字串
function S(id,label,en,opts,normal,star){ return {id,type:"select",label,en:en||"",opts,normal,star:!!star}; }
// group：多欄位（GCS / 肌力）
function G(id,label,en,fields,star,total){ return {id,type:"group",label,en:en||"",fields,star:!!star,total:total||null}; }
// text：純文字/數值欄位
function X(id,label,en){ return {id,type:"text",label,en:en||""}; }
// follow-up 建構
function fS(id,label,opts){ return {id,type:"select",label,opts}; }
function fT(id,label){ return {id,type:"text",label}; }
function fToggle(id,label){ return {id,type:"toggle",label}; }

/* ---------- 內容目錄（ROS + PE） ---------- */
const SECTIONS = [
/* ================= ROS ================= */
{key:"ros_const",kind:"ROS",label:"一般全身 Constitutional",items:[
  T("fever","發燒","Fever",1,[fT("fever_t","體溫/描述")]),
  T("chills","畏寒","Chills"),
  T("night_sweats","盜汗","Night sweats"),
  T("wt_loss","體重減輕","Weight loss",1,[fT("wt_loss_a","公斤 / 期間")]),
  T("wt_gain","體重增加","Weight gain"),
  T("fatigue","疲倦","Fatigue"),
  T("anorexia","食慾不振","Anorexia"),
  T("malaise","全身倦怠","Malaise"),
]},
{key:"ros_skin",kind:"ROS",label:"皮膚 Skin",items:[
  T("rash","皮疹","Rash"),
  T("pruritus","搔癢","Pruritus"),
  T("easy_bruise","容易瘀青","Easy bruising"),
  T("skin_lesion","皮膚病灶/腫塊","Skin lesion",0,[fT("skin_lesion_d","描述")]),
]},
{key:"ros_heent",kind:"ROS",label:"頭頸五官 HEENT / Neck",items:[
  T("headache","頭痛","Headache",1,[fT("headache_d","部位/性質")]),
  T("dizziness","頭暈","Dizziness"),
  T("vertigo","眩暈","Vertigo"),
  T("vision_change","視力改變","Vision change",0,[fT("vision_d","描述")]),
  T("diplopia","複視","Diplopia"),
  T("eye_pain","眼痛/眼紅","Eye pain/redness"),
  T("hearing_loss","聽力下降","Hearing loss"),
  T("tinnitus","耳鳴","Tinnitus"),
  T("ear_pain","耳痛","Otalgia"),
  T("nasal_cong","鼻塞","Nasal congestion"),
  T("rhinorrhea","流鼻水","Rhinorrhea"),
  T("epistaxis","鼻出血","Epistaxis"),
  T("sore_throat","喉嚨痛","Sore throat"),
  T("hoarseness","聲音沙啞","Hoarseness"),
  T("dysphagia","吞嚥困難","Dysphagia"),
  T("odynophagia","吞嚥疼痛","Odynophagia"),
  T("neck_mass","頸部腫塊","Neck mass"),
  T("neck_stiff_ros","頸部僵硬","Neck stiffness"),
]},
{key:"ros_resp",kind:"ROS",label:"呼吸 Respiratory",items:[
  T("cough","咳嗽","Cough",1,[fS("cough_type","型態",["乾咳 dry","有痰 productive"])]),
  T("sputum","痰","Sputum",0,[fS("sputum_c","顏色",["白 white","黃 yellow","綠 green","血絲 blood-tinged","鐵鏽色 rusty"])]),
  T("hemoptysis","咳血","Hemoptysis",1),
  T("dyspnea","呼吸困難","Dyspnea",1,[fS("dyspnea_g","程度",["勞力性 exertional","休息時 at rest"])]),
  T("wheezing_ros","喘鳴","Wheezing"),
  T("pleuritic","胸膜性胸痛","Pleuritic pain"),
]},
{key:"ros_cv",kind:"ROS",label:"心血管 Cardiovascular",items:[
  T("chest_pain","胸痛","Chest pain",1,[
    fS("cp_char","性質",["壓迫感 pressure","緊縮 tightness","刺痛 sharp","灼熱 burning"]),
    fS("cp_rad","放射",["左臂 left arm","下顎 jaw","背部 back","無 none"]),
    fS("cp_trig","誘發",["勞力 exertion","休息 rest","進食 eating","情緒 emotion"]),
  ]),
  T("palpitation","心悸","Palpitations",1),
  T("exert_dyspnea","勞力性呼吸困難","Exertional dyspnea",1),
  T("orthopnea","端坐呼吸","Orthopnea",1),
  T("pnd","陣發性夜間呼吸困難","PND",1),
  T("leg_edema","下肢水腫","Leg edema",1),
  T("syncope","暈厥","Syncope",1),
  T("presyncope","昏厥前","Presyncope"),

   ======================================================================= */
let DB = {patients:[]};
let saveTimer=null;
function save(){ if(saveTimer)clearTimeout(saveTimer); saveTimer=setTimeout(()=>Store.write(DB),150); }
function saveNow(){ if(saveTimer)clearTimeout(saveTimer); Store.write(DB); }

const $ = s=>document.querySelector(s);
const wrap = $("#wrap");
const scrim = $("#scrim");

function uid(){ return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmtTime(ts){
  const d=new Date(ts), p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600);
}

/* ---------- 每一項目狀態存取 ---------- */
function vOf(p,id){ if(!p.values[id]) p.values[id]={}; return p.values[id]; }

/* 判斷「有異常/需記錄」 */
function hasFinding(p,it){
  const v=p.values[it.id]||{};
  if(it.type==="toggle") { if(v.on) return true; }
  else if(it.type==="select"){ if(v.sel && v.sel!==it.normal) return true; }
  else if(it.type==="group"){ if(it.fields.some(f=>{const g=(v.grp||{})[f.id]; return g && g!==f.normal;})) return true; }
  else if(it.type==="text"){ if(v.text && v.text.trim()) return true; }
  if(v.note && v.note.trim()) return true;
  return false;
}

/* =======================================================================
   畫面 1：病人清單
   ======================================================================= */
function renderList(){
  closeMenu();
  let html = `
  <div class="hero">
    <h1>查房快速紀錄</h1>
    <p>ROS / PE Rounding Note — 點選病人進入紀錄，資料自動儲存</p>
  </div>
  <div class="list" id="listArea"></div>
  <button class="fab" id="fabNew">＋ 新增病人</button>`;
  wrap.innerHTML = html;
  drawList();
  $("#fabNew").onclick = showNewForm;
}

function drawList(){
  const area=$("#listArea"); if(!area) return;
  const ps=[...DB.patients].sort((a,b)=>b.updatedAt-a.updatedAt);
  if(ps.length===0){
    area.innerHTML=`<div class="empty"><div class="em-ic">🗂️</div><p>尚無病人紀錄<br>點下方「新增病人」開始</p></div>`;
    return;
  }
  area.innerHTML = ps.map(p=>{
    const spec=SPEC_INDEX[p.specialty]||SPEC_INDEX.general;
    const nPos = countPositives(p);
    return `<div class="pcard" data-open="${p.id}">
      <div class="pc-main">
        <div class="pc-code">${escapeHtml(p.code||"（未命名）")}</div>
        <div class="pc-meta">
          <span class="spec-badge">${escapeHtml(spec.label)}</span>
          <span>更新 ${fmtTime(p.updatedAt)}</span>
          ${nPos?`<span style="color:var(--pos);font-weight:700">陽性/異常 ${nPos}</span>`:""}
        </div>
      </div>
      <button class="pc-del" data-del="${p.id}" title="刪除">×</button>
    </div>`;
  }).join("");
  area.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click",e=>{ if(e.target.closest("[data-del]"))return; openNote(el.getAttribute("data-open")); });
  });
  area.querySelectorAll("[data-del]").forEach(el=>{
    el.addEventListener("click",e=>{ e.stopPropagation(); delPatient(el.getAttribute("data-del")); });
  });
}

function countPositives(p){
  let n=0;
  SECTIONS.forEach(sec=>sec.items.forEach(it=>{ if(hasFinding(p,it)) n++; }));
  return n;
}

function showNewForm(){
  const area=$("#listArea");
  if($("#newForm")) { $("#newForm input").focus(); return; }
  const div=document.createElement("div");
  div.id="newForm"; div.className="newform";
  div.innerHTML=`
    <h3>新增病人紀錄</h3>
    <div class="field">
      <label>病人代號 Patient code</label>
      <input id="nf_code" placeholder="例：3F-12 王 / Bed 07" autocomplete="off">
    </div>
    <div class="field">
      <label>科別 Department（可不指定）</label>
      <select id="nf_spec">${SPECIALTIES.map(s=>`<option value="${s.key}">${s.label}</option>`).join("")}</select>
    </div>
    <div class="row">
      <button class="btn" id="nf_cancel">取消</button>
      <button class="btn primary" id="nf_create">建立並開始</button>
    </div>`;
  area.prepend(div);
  $("#nf_code").focus();
  $("#nf_cancel").onclick=()=>div.remove();
  $("#nf_create").onclick=()=>{
    const code=$("#nf_code").value.trim();
    const spec=$("#nf_spec").value;
    const now=Date.now();
    const p={id:uid(),code:code||"（未命名）",specialty:spec,createdAt:now,updatedAt:now,values:{},globalNote:""};
    DB.patients.push(p); saveNow(); openNote(p.id);
  };
}

function delPatient(id){
  const p=DB.patients.find(x=>x.id===id); if(!p)return;
  if(!confirm(`確定刪除「${p.code}」的紀錄？此動作無法復原。`)) return;
  DB.patients=DB.patients.filter(x=>x.id!==id); saveNow(); drawList();
  toast("已刪除");
}

      <div class="mlabel">限縮版（Focus＋陽性/異常＋備註）</div>
      <button data-exp="lim-pdf">📄 匯出 PDF（限縮）</button>
      <button data-exp="lim-txt">📝 匯出 TXT（限縮）</button>
      <div class="mdiv"></div>
      <div class="mlabel">完整版（全部項目）</div>
      <button data-exp="all-pdf">📄 匯出 PDF（完整）</button>
      <button data-exp="all-txt">📝 匯出 TXT（完整）</button>
    </div>`;

  $("#backBtn").onclick=()=>{ saveNow(); CUR=null; renderList(); };
  $("#specSel").onchange=e=>{ p.specialty=e.target.value; touch(); buildBody(); };
  $("#exportBtn").onclick=e=>{ e.stopPropagation(); toggleMenu(); };
  scrim.onclick=closeMenu;
  $("#exportMenu").querySelectorAll("[data-exp]").forEach(b=>{
    b.onclick=()=>{ closeMenu(); doExport(b.getAttribute("data-exp")); };
  });
  buildBody();
}

function touch(){ CUR.updatedAt=Date.now(); save(); updateSummary(); }

function updateSummary(){
  const el=$("#summary"); if(!el)return;
  const n=countPositives(CUR);
  const spec=SPEC_INDEX[CUR.specialty]||SPEC_INDEX.general;
  el.innerHTML = `${spec.focus.length?`重點 ${spec.focus.length} 項 · `:""}目前 <b>${n}</b> 項陽性/異常 · 自動儲存`;
}

/* 英文在前、中文在後拆解 label（用於區塊標題） */
function flipLabel(s){
  const m=String(s).match(/^(.+?)\s+([A-Za-z].*)$/);
  if(m) return {en:m[2], zh:m[1]};
  return {en:s, zh:""};
}
function headTemplate(titleHtml, tag, isFocus){
  return `<div class="sec-head">
      ${isFocus?`<span class="focus-flag">${tag}</span>`:`<span class="kindtag">${tag}</span>`}
      <span class="st">${titleHtml}</span>
      <span class="cnt zero">0</span>
      <button class="secnote-btn" data-secnote title="區塊備註">✎</button>
      <span class="chev">▾</span>
    </div>`;
}
function focusHeadHtml(kind){
  const zh = kind==="ROS" ? "重點問診" : "重點理學檢查";
  return headTemplate(`<span class="st-en">Focus ${kind}</span><span class="st-zh">${zh}</span>`, "★ 重點", true);
}
function sysHeadHtml(secDef){
  const f=flipLabel(secDef.label);
  return headTemplate(`<span class="st-en">${escapeHtml(f.en)}</span>${f.zh?`<span class="st-zh">${escapeHtml(f.zh)}</span>`:""}`, secDef.kind, false);
}

/* 依科別組出：Focus ROS + Focus PE + 各系統區（排除已在 Focus 的） */
function buildBody(){
  const body=$("#noteBody"); body.innerHTML="";
  const p=CUR;
  const spec=SPEC_INDEX[p.specialty]||SPEC_INDEX.general;
  const focusSet=new Set(spec.focus);

  const addSection=(headHtml,items,isFocus,blockKey)=>{
    if(!items.length) return;
    const sec=document.createElement("div");
    sec.className="section"+(isFocus?" focus":"");
    sec.innerHTML=headHtml;
    const bodyEl=document.createElement("div"); bodyEl.className="sec-body";
    const bnVal=(p.blockNotes||{})[blockKey]||"";
    const bn=document.createElement("div"); bn.className="blocknote-wrap"+(bnVal?" show":"");
    bn.innerHTML=`<input class="blocknote-input" placeholder="這個區塊的備註…" value="${escapeHtml(bnVal)}">`;
    bodyEl.appendChild(bn);
    items.forEach(it=>bodyEl.appendChild(renderItem(it)));
    sec.appendChild(bodyEl);
    sec._items=items;
    wireSection(sec, blockKey, !!bnVal);
    body.appendChild(sec);
  };

  // Focus 拆成 ROS / PE 兩區
  if(spec.focus.length){
    const fitems = spec.focus.map(id=>ITEM_INDEX[id]&&ITEM_INDEX[id].item).filter(Boolean);
    addSection(focusHeadHtml("ROS"), fitems.filter(it=>it.kind==="ROS"), true, "focus_ros");
    addSection(focusHeadHtml("PE"),  fitems.filter(it=>it.kind==="PE"),  true, "focus_pe");
  }

  // 其餘系統（ROS 再 PE，順序同 SECTIONS）
  SECTIONS.forEach(secDef=>{
    addSection(sysHeadHtml(secDef), secDef.items.filter(it=>!focusSet.has(it.id)), false, secDef.key);
  });

  // 底部總備註
  const gn=document.createElement("div");
  gn.className="gnote";
  gn.innerHTML=`<label>其他備註 Additional notes</label>
    <textarea id="globalNote" placeholder="記錄上面沒有的資訊：impression、plan、pending labs、家屬溝通…">${escapeHtml(p.globalNote||"")}</textarea>`;
  body.appendChild(gn);
  $("#globalNote").addEventListener("input",e=>{ p.globalNote=e.target.value; touch(); });

  refreshAllCounts();
  updateSummary();
}
function wireSection(sec, blockKey, hasNote){
  const head=sec.querySelector(".sec-head");
  const noteBtn=sec.querySelector("[data-secnote]");
  const wrap=sec.querySelector(".blocknote-wrap");
  const input=wrap.querySelector(".blocknote-input");
  if(hasNote) noteBtn.classList.add("active");
  head.addEventListener("click",e=>{
    if(e.target.closest("[data-secnote]")) return;
    sec.classList.toggle("collapsed");
  });
  noteBtn.addEventListener("click",e=>{
    e.stopPropagation();
    sec.classList.remove("collapsed");
    const show=wrap.classList.toggle("show");
    noteBtn.classList.toggle("active", show || !!input.value);
    if(show) input.focus();
  });
  input.addEventListener("input",()=>{
    if(!CUR.blockNotes) CUR.blockNotes={};
    CUR.blockNotes[blockKey]=input.value;
    noteBtn.classList.toggle("active", wrap.classList.contains("show") || !!input.value);
    touch();
  });
}

/* ---------- 單一項目 render ---------- */
function renderItem(it){
  const p=CUR, v=vOf(p,it.id);
  const el=document.createElement("div");
  el.className="item"; el.dataset.item=it.id;

  const enText = it.en || it.label;        // 英文為主（無 en 時 label 本身即英文/術語）
  const zhText = it.en ? it.label : "";    // 有 en 時 label 為中文副標
  const labelHtml=`<div class="item-label"><span class="lab-en">${escapeHtml(enText)}${it.star?'<span class="star">★</span>':""}</span>${zhText?`<span class="lab-zh">${escapeHtml(zhText)}</span>`:""}</div>`;

  let control="";
  if(it.type==="toggle"){
    control=`<button class="toggle ${v.on?"on":""}" data-toggle>${v.on?"(+) 陽性":"(−) 陰性"}</button>`;
  }else if(it.type==="select"){
    control=selectHtml(it,v.sel);
  }else if(it.type==="group"){
    control=""; // 群組另起一行
  }else if(it.type==="text"){
    control=`<input class="isel" style="max-width:56%" data-textfield value="${escapeHtml(v.text||"")}" placeholder="輸入">`;
  }

  el.innerHTML=`<div class="item-row">
      ${labelHtml}
      ${control}
      <button class="notebtn ${v.note?"active":""}" data-notebtn title="備註">✎</button>
    </div>`;

  // group 內容
  if(it.type==="group"){
    el.querySelector(".item-row").insertBefore(buildGroup(it,v), el.querySelector("[data-notebtn]"));
  }

  // follow-up 容器
  if(it.type==="toggle" && it.fu){
    const sub=buildFollowUps(it,v);
    el.appendChild(sub);
    if(v.on) sub.classList.add("show");
  }

  // 備註欄
  const noteInput=document.createElement("input");
  noteInput.className="itemnote"+(v.note?" show":"");
  noteInput.setAttribute("data-noteinput","");
  noteInput.placeholder="敘述 / 備註";
  noteInput.value=v.note||"";
  el.appendChild(noteInput);

  wireItem(el,it);
  applyItemHitClass(el,it);
  return el;
}

function selectHtml(it,val){
  const abn = val && val!==it.normal;
  const opts=[`<option value="">— 未評估 —</option>`].concat(it.opts.map(o=>`<option value="${escapeHtml(o)}" ${o===val?"selected":""}>${escapeHtml(o)}</option>`)).join("");
  return `<select class="isel ${abn?"abn":""}" data-select>${opts}</select>`;
}

function buildGroup(it,v){
  const g=v.grp||{};
  const wrapEl=document.createElement("div");
  wrapEl.className="grpwrap";
  it.fields.forEach(f=>{
    const cur=g[f.id]||"";
    const abn=cur && cur!==f.normal;
    const optHtml=[`<option value="">–</option>`].concat(f.opts.map(o=>`<option value="${o}" ${o===cur?"selected":""}>${o}</option>`)).join("");
    const fld=document.createElement("div");
    fld.className="grpfield";
    fld.innerHTML=`<span>${f.label}</span><select data-grp="${f.id}" class="${abn?"abn":""}">${optHtml}</select>`;
    wrapEl.appendChild(fld);
  });
  if(it.total){
    const tot=document.createElement("span");
    tot.className="grptotal"; tot.dataset.total="1";
    wrapEl.appendChild(tot);
  }
  return wrapEl;
}
function updateGroupTotal(el,it,v){
  const totEl=el.querySelector("[data-total]"); if(!totEl)return;
  const g=v.grp||{};
  let allSet=it.fields.every(f=>g[f.id]);
  if(!allSet){ totEl.textContent=""; totEl.classList.remove("abn"); return; }
  let sum=it.fields.reduce((a,f)=>a+parseInt(g[f.id],10),0);
  totEl.textContent=`= ${sum}`;
  totEl.classList.toggle("abn", sum<it.total);
}

function buildFollowUps(it,v){
  const sub=document.createElement("div");
  sub.className="subwrap";
  const fv=v.fu||{};
  it.fu.forEach(f=>{
    const row=document.createElement("div"); row.className="subrow";
    if(f.type==="select"){
      const cur=fv[f.id]||"";
      const opts=[`<option value="">— 選擇 —</option>`].concat(f.opts.map(o=>`<option value="${escapeHtml(o)}" ${o===cur?"selected":""}>${escapeHtml(o)}</option>`)).join("");
      row.innerHTML=`<span class="sublab">${escapeHtml(f.label)}</span><select class="subsel" data-fu="${f.id}">${opts}</select>`;
    }else if(f.type==="text"){
      row.innerHTML=`<span class="sublab">${escapeHtml(f.label)}</span><input class="subtext" data-fu="${f.id}" value="${escapeHtml(fv[f.id]||"")}" placeholder="輸入">`;
    }else if(f.type==="toggle"){
      const on=fv[f.id]==="1";
      row.innerHTML=`<button class="toggle ${on?"on":""}" data-futoggle="${f.id}" style="min-width:auto;font-size:12.5px;padding:5px 12px">${escapeHtml(f.label)} ${on?"(+)":""}</button>`;
    }
    sub.appendChild(row);
  });
  return sub;
}

/* ---------- 事件綁定 ---------- */
function wireItem(el,it){
  const p=CUR, v=vOf(p,it.id);

  const tgl=el.querySelector("[data-toggle]");
  if(tgl){
    tgl.addEventListener("click",()=>{
      v.on=!v.on;
      tgl.classList.toggle("on",v.on);
      tgl.textContent=v.on?"(+) 陽性":"(−) 陰性";
      const sub=el.querySelector(".subwrap"); if(sub) sub.classList.toggle("show",v.on);
      applyItemHitClass(el,it); touch(); refreshCountFor(el);
    });
  }

  const sel=el.querySelector("[data-select]");
  if(sel){
    sel.addEventListener("change",()=>{
      v.sel=sel.value;
      sel.classList.toggle("abn", v.sel && v.sel!==it.normal);
      applyItemHitClass(el,it); touch(); refreshCountFor(el);
    });
  }

  el.querySelectorAll("[data-grp]").forEach(gs=>{
    gs.addEventListener("change",()=>{
      if(!v.grp)v.grp={};
      const fid=gs.getAttribute("data-grp");
      v.grp[fid]=gs.value;
      const f=it.fields.find(x=>x.id===fid);
      gs.classList.toggle("abn", gs.value && gs.value!==f.normal);
      updateGroupTotal(el,it,v);
      applyItemHitClass(el,it); touch(); refreshCountFor(el);
    });
  });
  if(it.type==="group") updateGroupTotal(el,it,v);

  const tf=el.querySelector("[data-textfield]");
  if(tf){
    tf.addEventListener("input",()=>{ v.text=tf.value; applyItemHitClass(el,it); touch(); refreshCountFor(el); });
  }

  el.querySelectorAll("[data-fu]").forEach(f=>{
    const fid=f.getAttribute("data-fu");
    const ev = f.tagName==="SELECT"?"change":"input";
    f.addEventListener(ev,()=>{ if(!v.fu)v.fu={}; v.fu[fid]=f.value; touch(); });
  });
  el.querySelectorAll("[data-futoggle]").forEach(b=>{
    const fid=b.getAttribute("data-futoggle");
    b.addEventListener("click",()=>{
      if(!v.fu)v.fu={};
      const on=v.fu[fid]==="1"; v.fu[fid]=on?"":"1";
      b.classList.toggle("on",!on);
      const base=b.textContent.replace(/\s*\(\+\)\s*$/,"").trim();
      b.textContent = !on?base+" (+)":base;
      touch();
    });
  });

  const nb=el.querySelector("[data-notebtn]");
  const ni=el.querySelector("[data-noteinput]");
  nb.addEventListener("click",()=>{
    const show=ni.classList.toggle("show");
    nb.classList.toggle("active", show || !!v.note);
    if(show) ni.focus();
  });
  ni.addEventListener("input",()=>{
    v.note=ni.value;
    nb.classList.toggle("active", ni.classList.contains("show")|| !!v.note);
    applyItemHitClass(el,it); touch(); refreshCountFor(el);
  });
}

function applyItemHitClass(el,it){
  el.classList.toggle("hit", hasFinding(CUR,it) && it.type==="toggle" && (CUR.values[it.id]||{}).on);
}

/* ---------- 各區塊陽性計數 ---------- */
function refreshCountFor(el){
  const sec=el.closest(".section"); if(sec) updateSecCount(sec);
  updateSummary();
}
function updateSecCount(sec){
  const badge=sec.querySelector(".cnt"); if(!badge)return;
  const items=sec._items||[];
  let n=items.reduce((a,it)=>a+(hasFinding(CUR,it)?1:0),0);
  badge.textContent=n; badge.classList.toggle("zero",n===0);
}
function refreshAllCounts(){ document.querySelectorAll(".section").forEach(updateSecCount); }

/* ---------- 匯出選單 ---------- */
function toggleMenu(){ const m=$("#exportMenu"); const open=m.classList.toggle("show"); scrim.classList.toggle("show",open); }
function closeMenu(){ const m=$("#exportMenu"); if(m)m.classList.remove("show"); scrim.classList.remove("show"); }

/* =======================================================================
   匯出：文字模型 → TXT / PDF(列印)
   ======================================================================= */
function labelPlain(it){ return it.en ? `${it.en}（${it.label}）` : it.label; }

function itemLine(it){
  const v=CUR.values[it.id]||{};
  let val="", pos=false;
  if(it.type==="toggle"){
    pos=!!v.on;
    val = pos?"(+) 陽性":"(−) 陰性";
    if(pos && it.fu){
      const parts=[];
      it.fu.forEach(f=>{
        const fv=(v.fu||{})[f.id];
        if(f.type==="toggle"){ if(fv==="1") parts.push(f.label+"(+)"); }
        else if(fv && String(fv).trim()){ parts.push(`${f.label}: ${fv}`); }
      });
      if(parts.length) val += "｜"+parts.join("；");
    }
  }else if(it.type==="select"){
    val = v.sel || "未評估";
    pos = v.sel && v.sel!==it.normal;
  }else if(it.type==="group"){
    const g=v.grp||{};
    const parts=it.fields.map(f=>`${f.label}${g[f.id]||"–"}`);
    let s=parts.join("");
    if(it.total && it.fields.every(f=>g[f.id])){
      const sum=it.fields.reduce((a,f)=>a+parseInt(g[f.id],10),0);
      s+=` (${sum})`;
    }
    val=s;
    pos=it.fields.some(f=>g[f.id] && g[f.id]!==f.normal);
  }else if(it.type==="text"){
    val = v.text && v.text.trim() ? v.text : "—";
    pos = v.text && v.text.trim();
  }
  const note = (v.note&&v.note.trim())?`　※${v.note.trim()}`:"";
  return {label:labelPlain(it), val, pos:!!pos, note, hasNote:!!(v.note&&v.note.trim())};
}

/* 建立匯出模型：limited=true 只留 Focus∪異常∪備註 */
function buildModel(limited){
  const p=CUR;
  const bn=p.blockNotes||{};
  const spec=SPEC_INDEX[p.specialty]||SPEC_INDEX.general;
  const focusSet=new Set(spec.focus);
  const alwaysKeys=new Set(["ros_const","pe_general"]); // 限縮版也整段匯出
  const out=[];

  if(spec.focus.length){
    const fitems=spec.focus.map(id=>ITEM_INDEX[id]&&ITEM_INDEX[id].item).filter(Boolean);
    const fRos=fitems.filter(it=>it.kind==="ROS");
    const fPe =fitems.filter(it=>it.kind==="PE");
    if(fRos.length||bn.focus_ros) out.push({title:"★ Focus ROS（重點問診）", note:bn.focus_ros||"", lines:fRos.map(itemLine)});
    if(fPe.length||bn.focus_pe)   out.push({title:"★ Focus PE（重點理學檢查）", note:bn.focus_pe||"", lines:fPe.map(itemLine)});
  }
  SECTIONS.forEach(sec=>{
    let items=sec.items.filter(it=>!focusSet.has(it.id));
    const always=alwaysKeys.has(sec.key);
    if(limited && !always) items=items.filter(it=>hasFinding(p,it));
    const note=bn[sec.key]||"";
    if(items.length===0 && !note) return;
    const f=flipLabel(sec.label);
    out.push({title:`${f.en}${f.zh?"（"+f.zh+"）":""} · ${sec.kind}`, note, lines:items.map(itemLine)});
  });
  return out;
}

function exportHeader(){
  const p=CUR;
  const spec=SPEC_INDEX[p.specialty]||SPEC_INDEX.general;
  return {code:p.code, spec:spec.label, time:fmtTime(Date.now())};
}

/* ----- TXT ----- */
function buildText(limited){
  const h=exportHeader();
  const L=[];
  L.push("查房紀錄 ROS / PE Rounding Note");
  L.push(`病人代號：${h.code}`);
  L.push(`科別：${h.spec}`);
  L.push(`匯出時間：${h.time}`);
  L.push(limited?"（限縮版：重點＋陽性/異常＋備註）":"（完整版：全部項目）");
  L.push("".padEnd(40,"="));
  buildModel(limited).forEach(sec=>{
    L.push("");
    L.push(`【${sec.title}】`);
    if(sec.note) L.push(`  § 區塊備註：${sec.note}`);
    sec.lines.forEach(ln=>{
      L.push(`  ${ln.pos?"●":"○"} ${ln.label}：${ln.val}${ln.note}`);
    });
  });
  const gn=(CUR.globalNote||"").trim();
  L.push("");
  L.push("【其他備註 Additional notes】");
  L.push(gn?("  "+gn.split("\n").join("\n  ")):"  （無）");
  L.push("");
  L.push("".padEnd(40,"="));
  L.push("※ 本紀錄為臨床輔助草稿，請自行核對後再正式記載。");
  return L.join("\n");
}

function downloadText(filename,text){
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ----- PDF（列印） ----- */
function buildPrintHtml(limited){
  const h=exportHeader();
  let html=`<div class="pr-h">
      <h1>查房紀錄 ROS / PE</h1>
      <div class="pr-meta">病人代號：<b>${escapeHtml(h.code)}</b>　｜　科別：${escapeHtml(h.spec)}　｜　${h.time}<br>
      ${limited?"限縮版（重點＋陽性/異常＋備註）":"完整版（全部項目）"}</div>
    </div>`;
  buildModel(limited).forEach(sec=>{
    html+=`<div class="pr-sec"><h2>${escapeHtml(sec.title)}</h2>`;
    if(sec.note) html+=`<div class="pr-line" style="color:#0a5460"><b>§ 區塊備註：</b>${escapeHtml(sec.note)}</div>`;
    sec.lines.forEach(ln=>{
      html+=`<div class="pr-line ${ln.pos?"pos":""}">${ln.pos?"● ":"○ "}<span class="k">${escapeHtml(ln.label)}</span>：${escapeHtml(ln.val)}${ln.note?` <i>${escapeHtml(ln.note)}</i>`:""}</div>`;
    });
    html+=`</div>`;
  });
  const gn=(CUR.globalNote||"").trim();
  html+=`<div class="pr-sec"><h2>其他備註 Additional notes</h2><div class="pr-note">${gn?escapeHtml(gn):"（無）"}</div></div>`;
  html+=`<div style="margin-top:14px;font-size:11px;color:#666">※ 本紀錄為臨床輔助草稿，請自行核對後再正式記載。列印對話框請選擇「另存為 PDF」。</div>`;
  return html;
}

/* 穩健列印：優先開新視窗（自帶內容），失敗才退回頁內列印 */
function robustPrint(limited){
  let w=null;
  try{ w=window.open("","_blank"); }catch(e){ w=null; }
  if(w && w.document){
    try{
      w.document.open(); w.document.write(printDocument(limited)); w.document.close();
      const go=()=>{ try{ w.focus(); w.print(); }catch(e){} };
      if(w.document.readyState==="complete") setTimeout(go,300);
      else w.onload=()=>setTimeout(go,250);
      return;
    }catch(e){ try{ w.close(); }catch(_){} }
  }
  const pa=$("#printArea");
  pa.innerHTML=buildPrintHtml(limited);
  const done=()=>{ pa.innerHTML=""; window.removeEventListener("afterprint",done); };
  window.addEventListener("afterprint",done);
  setTimeout(()=>{ try{ window.print(); }catch(e){} },80);
}

/* 複製全文（clipboard API，退回 execCommand） */
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallbackCopy(text));
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  try{
    const ta=document.createElement("textarea"); ta.value=text;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.focus(); ta.select(); const ok=document.execCommand("copy"); ta.remove(); return ok;
  }catch(e){ return false; }
}

/* 匯出 → 開啟預覽 modal（先看到內容，證明不空白；並提供複製作為保底） */
function doExport(kind){
  const limited = kind.indexOf("lim")===0;
  const isPdf   = kind.indexOf("pdf")>=0;
  openExportModal(limited,isPdf);
}
function mkBtn(label,cls,fn){ const b=document.createElement("button"); b.className="btn "+cls; b.textContent=label; b.onclick=fn; return b; }
function closeExportModal(){ $("#exportModal").classList.remove("show"); }

function openExportModal(limited,isPdf){
  const h=exportHeader();
  const stamp=(h.code||"note").replace(/[^\w\u4e00-\u9fa5-]/g,"_");
  const text=buildText(limited);
  const modal=$("#exportModal");
  $("#modalTitle").textContent = `${isPdf?"PDF":"TXT"} 預覽 · ${limited?"限縮版":"完整版"}`;
  const scroll=$("#modalScroll");
  if(isPdf){
    scroll.innerHTML=`<div class="docprev">${buildPrintHtml(limited)}</div>`;
  }else{
    scroll.innerHTML="";
    const pre=document.createElement("div"); pre.className="txtprev"; pre.textContent=text;
    scroll.appendChild(pre);
  }
  const foot=$("#modalFoot"); foot.innerHTML="";
  const btnCopy=mkBtn("📋 複製全文","",()=>{ copyText(text).then(ok=>toast(ok?"已複製到剪貼簿":"複製失敗，請長按選取")); });
  if(isPdf){
    foot.appendChild(mkBtn("🖨 列印 / 存成 PDF","primary",()=>robustPrint(limited)));
    foot.appendChild(btnCopy);
  }else{
    foot.appendChild(mkBtn("⬇ 下載 .txt","primary",()=>{ downloadText(`ROS_PE_${stamp}_${limited?"限縮":"完整"}.txt`, text); toast("已下載 .txt"); }));
    foot.appendChild(btnCopy);
  }
  modal.classList.add("show");
}

/* ---------- utils ---------- */
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* 關閉匯出選單（點外部） */
document.addEventListener("click",e=>{
  const m=$("#exportMenu");
  if(m&&m.classList.contains("show") && !e.target.closest("#exportMenu") && !e.target.closest("#exportBtn")) closeMenu();
});

/* ---------- 匯出 modal 關閉 ---------- */
(function(){
  const mc=$("#modalClose"), mm=$("#exportModal");
  if(mc) mc.onclick=closeExportModal;
  if(mm) mm.addEventListener("click",e=>{ if(e.target.id==="exportModal") closeExportModal(); });
})();

/* ---------- 啟動：先載入資料再渲染 ---------- */
(async function boot(){
  try{ DB = (await Store.read()) || {patients:[]}; }
  catch(e){ DB = {patients:[]}; }
  if(!DB.patients) DB.patients=[];
  renderList();
})();
</script>
