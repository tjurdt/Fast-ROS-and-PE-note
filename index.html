<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>查房快速紀錄 · 複選常開與感覺異常修正版</title>
<style>
  :root{
    --bg:#eef2f4; --surface:#ffffff; --ink:#12303d; --ink2:#3d5a67;
    --muted:#6f8794; --line:#d6e0e4; --line2:#e7eef1;
    --primary:#0e6b7a; --primary-d:#0a5460; --primary-soft:#e0f0f2;
    --pos:#b45309; --pos-bg:#fdf3e3; --pos-line:#e8b878;
    --focus:#0e6b7a; --focus-bg:#eef7f8; --focus-line:#9bcfd6;
    --danger:#b02a37;
    --radius:12px; --radius-s:9px;
    --shadow:0 1px 2px rgba(18,48,61,.06),0 6px 20px rgba(18,48,61,.06);
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}
  .wrap{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg)}

  /* ---------- top bars ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);
    backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);
    padding:10px 14px;display:flex;align-items:center;gap:10px}
  .topbar .grow{flex:1;min-width:0}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:9px 13px;border-radius:var(--radius-s);font-size:14px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:active{background:var(--primary-d)}
  .btn.ghost{border-color:transparent;background:transparent;padding:8px 8px}
  .btn.sm{padding:6px 10px;font-size:13px}

  /* ---------- patient list ---------- */
  .hero{padding:26px 18px 10px}
  .hero h1{margin:0;font-size:22px;letter-spacing:.5px;font-weight:800;color:var(--ink)}
  .hero p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
  .list{padding:8px 14px 90px}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 14px;margin:10px 0;display:flex;align-items:center;gap:12px}
  .pcard:active{border-color:var(--primary)}
  .pcard .pc-main{flex:1;min-width:0}
  .pc-code{font-weight:800;font-size:17px;letter-spacing:.4px;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .pc-meta{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .spec-badge{background:var(--primary-soft);color:var(--primary-d);border-radius:20px;
    padding:2px 10px;font-size:12px;font-weight:700}
  .pc-del{border:none;background:transparent;color:var(--muted);font-size:20px;
    width:36px;height:36px;border-radius:8px;line-height:1}
  .pc-del:active{background:#f4d9dc;color:var(--danger)}
  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  .empty .em-ic{font-size:40px;opacity:.5}

  /* new patient form */
  .newform{background:var(--surface);border:1px dashed var(--primary);border-radius:var(--radius);
    padding:16px 14px;margin:10px 0}
  .newform h3{margin:0 0 12px;font-size:15px;color:var(--primary-d)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:var(--radius-s);background:#fff;color:var(--ink)}
  .newform .row{display:flex;gap:10px}
  .newform .row .btn{flex:1;justify-content:center}

  /* fab */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;
    background:var(--primary);color:#fff;border:none;border-radius:26px;
    padding:14px 22px;font-size:15px;font-weight:700;box-shadow:0 6px 22px rgba(14,107,122,.4);
    display:inline-flex;gap:8px;align-items:center}
  .fab:active{background:var(--primary-d)}

  /* ---------- note view ---------- */
  .note-sub{padding:10px 14px 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .note-sub .pcode{font-weight:800;font-size:16px;letter-spacing:.4px}
  .specsel{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-s);
    background:#fff;color:var(--ink);font-weight:600;font-size:13.5px}
  .summary{padding:0 14px 6px;color:var(--muted);font-size:12.5px}
  .summary b{color:var(--pos)}

  .note-body{padding:6px 12px 120px}
  .section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
  .section.focus{border-color:var(--focus-line);background:var(--focus-bg)}
  .sec-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
  .sec-head .st{flex:1;font-weight:800;font-size:14.5px;letter-spacing:.3px}
  .sec-head .kindtag{font-size:11px;font-weight:800;color:var(--muted);
    border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .section.focus .sec-head .st{color:var(--focus)}
  .focus-flag{font-size:11px;font-weight:800;color:#fff;background:var(--focus);
    border-radius:6px;padding:2px 8px}
  .cnt{font-size:12px;font-weight:800;color:var(--pos);background:var(--pos-bg);
    border:1px solid var(--pos-line);border-radius:20px;padding:1px 9px;min-width:22px;text-align:center}
  .cnt.zero{display:none}
  .chev{color:var(--muted);transition:transform .18s;font-size:13px}
  .section.collapsed .sec-body{display:none}
  .section.collapsed .chev{transform:rotate(-90deg)}
  .sec-body{border-top:1px solid var(--line2);padding:6px 0}
  .secnote-btn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;
    width:30px;height:30px;font-size:13px;line-height:1;flex:none;padding:0}
  .secnote-btn.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-d)}
  .section.focus .secnote-btn{border-color:var(--focus-line)}
  .blocknote-wrap{display:none;padding:8px 14px 2px}
  .blocknote-wrap.show{display:block}
  .blocknote-input{width:100%;padding:9px 11px;border:1px solid var(--primary);border-radius:9px;
    background:#fbfdfd;color:var(--ink);font-size:13.5px}

  /* item */
  .item{padding:9px 14px;border-bottom:1px solid var(--line2)}
  .item:last-child{border-bottom:none}
  .item-row{display:flex;align-items:center;gap:10px}
  .item-label{flex:1;line-height:1.25;min-width:0}
  .item-label .lab-en{font-size:15.5px;font-weight:600;color:var(--ink);letter-spacing:.1px}
  .item-label .lab-zh{display:block;font-size:11px;font-weight:400;color:var(--muted);opacity:.85;margin-top:1px}
  .star{color:var(--pos);font-weight:800;margin-left:3px;font-size:13px}
  /* section title en/zh */
  .st-en{font-weight:800;font-size:14.5px;letter-spacing:.2px}
  .st-zh{font-weight:500;font-size:11px;color:var(--muted);opacity:.9;margin-left:7px}
  .section.focus .st-zh{opacity:.85}

  /* toggle pill */
  .toggle{border:1.5px solid var(--line);background:#fff;color:var(--muted);
    border-radius:22px;padding:6px 15px;font-size:13.5px;font-weight:800;min-width:64px;text-align:center}
  .toggle .neg{color:var(--muted)}
  .toggle.on{background:var(--pos-bg);border-color:var(--pos-line);color:var(--pos)}
  .item.hit{background:var(--pos-bg)}
  .item.hit .lab-en{color:var(--pos)}

  .isel{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-s);
    background:#fff;color:var(--ink);font-weight:600;font-size:13.5px;max-width:56%}
  .isel.abn{border-color:var(--pos-line);background:var(--pos-bg);color:var(--pos)}

  .notebtn{border:1px solid var(--line);background:#fff;color:var(--muted);
    border-radius:8px;width:34px;height:34px;font-size:15px;line-height:1;flex:none}
  .notebtn.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-d)}

  .subwrap{margin-top:9px;padding-left:2px;display:none;flex-direction:column;gap:8px}
  /* 顱神經面板 */
  .cnpanel{display:none;margin:8px 0 2px;padding:8px 12px 4px;background:rgba(14,107,122,.05);border-top:1px dashed var(--line)}
  .cnpanel.show{display:block}
  .cn-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line2)}
  .cn-row:last-child{border-bottom:none}
  .cn-top{display:flex;align-items:center;gap:8px;width:100%}
  .cn-tog{border:1.5px solid var(--line);background:#fff;color:#2f7a43;border-radius:16px;
    padding:5px 12px;font-size:12px;font-weight:800;min-width:56px;flex:none}
  .cn-tog.on{background:var(--pos-bg);border-color:var(--pos-line);color:var(--pos)}
  .cn-lab{flex:1;font-size:13px;color:var(--ink2);min-width:110px}
  .cn-detail{display:none;width:100%}
  .cn-detail.show{display:block}
  .cn-grid{margin-bottom:8px}
  .cng-head,.cng-row{display:grid;grid-template-columns:1fr 56px 56px;gap:6px;align-items:center}
  .cng-head{font-size:11px;color:var(--muted);font-weight:800;text-align:center;padding-bottom:3px}
  .cng-row{padding:4px 0;border-top:1px solid var(--line2)}
  .cng-lab{font-size:12.5px;color:var(--ink2)}
  .cng-cell{height:32px;border:1.5px solid var(--line);background:#fff;border-radius:8px;
    color:var(--pos);font-size:14px;font-weight:800;line-height:1;padding:0}
  .cng-cell.on{background:var(--pos-bg);border-color:var(--pos-line)}
  .cn-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .cn-chip{border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:14px;
    padding:5px 11px;font-size:12px;font-weight:600;text-align:left}
  .cn-chip.on{background:var(--pos-bg);border-color:var(--pos-line);color:var(--pos);font-weight:800}
  .cn-note{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:#fbfdfd}
  /* DTR 格點（循環點擊） */
  .dtr-grid{padding:8px 12px 4px}
  .dtr-head,.dtr-row{display:grid;grid-template-columns:1fr 60px 60px;gap:8px;align-items:center}
  .dtr-head{font-size:11px;color:var(--muted);font-weight:800;padding-bottom:4px;text-align:center}
  .dtr-head span:first-child{text-align:left}
  .dtr-row{padding:4px 0;border-top:1px solid var(--line2)}
  .dtr-site{font-size:12.5px;color:var(--ink2)}
  .dtr-cell{height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;
    font-size:14px;font-weight:800;color:var(--ink2);padding:0}
  .dtr-cell.abn{border-color:var(--pos-line);background:var(--pos-bg);color:var(--pos)}
  /* Babinski / 蹠反射 */
  .plantar-wrap{display:flex;gap:10px;flex-wrap:wrap;padding:8px 12px 4px}
  .plantar-field{display:flex;align-items:center;gap:6px}
  .plantar-field span{font-size:12.5px;color:var(--ink2);font-weight:700}
  /* 循環點擊按鈕 */
  .icycle{border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:16px;
    padding:8px 14px;font-size:13px;font-weight:700;max-width:60%;text-align:center;line-height:1.25}
  .icycle.norm{border-color:#cfe6d4;background:#eef8f0;color:#2f7a43}
  .icycle.abn{border-color:var(--pos-line);background:var(--pos-bg);color:var(--pos)}
  /* 群組滑桿（肌力 / GCS） */
  .grpslider{flex-direction:column;align-items:stretch;gap:9px;width:100%}
  .grow-field{display:flex;align-items:center;gap:10px}
  .grow-field .gf-lab{font-size:12.5px;font-weight:800;color:var(--ink2);width:42px;flex:none}
  .grow-field input[type=range]{flex:1;accent-color:var(--primary)}
  .grow-field.abn input[type=range]{accent-color:var(--pos)}
  .grow-field .gf-val{font-size:14px;font-weight:800;color:var(--ink2);width:26px;text-align:right}
  .grow-field.abn .gf-val{color:var(--pos)}
  .grpslider .grptotal{font-size:12.5px;font-weight:800;color:var(--ink2);text-align:right;padding-right:2px}
  .grpslider .grptotal.abn{color:var(--pos)}

  /* 肌力 / GCS：清除回未評估 */
  .gf-clear{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;
    min-width:42px;height:30px;padding:0 6px;font-size:11px;font-weight:800;flex:none}
  .gf-clear:active{background:var(--line2);color:var(--ink)}

  /* 多筆感覺檢查 */
  .sensory-wrap{width:100%;padding:8px 12px 5px}
  .sensory-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sensory-hint{font-size:11px;color:var(--muted);flex:1;min-width:150px}
  .sensory-add{display:none}
  .sensory-add.show{display:inline-flex}
  .sensory-list{display:none;margin-top:8px;gap:8px;flex-direction:column}
  .sensory-list.show{display:flex}
  .sensory-empty{font-size:12px;color:var(--muted);padding:8px 2px}
  .sensory-entry{border:1px solid #cbdde1;border-left:4px solid var(--primary);border-radius:10px;background:#fbfdfd;padding:9px}
  .sensory-ehead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .sensory-num{font-size:12px;font-weight:800;color:var(--primary-d);flex:1}
  .sensory-del{border:1px solid #eecdd1;background:#fff;color:var(--danger);border-radius:7px;padding:5px 9px;font-size:11px;font-weight:800}
  .sensory-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .sensory-field{min-width:0}
  .sensory-field.full{grid-column:1/-1}
  .sensory-field label{display:block;font-size:10.5px;font-weight:800;color:var(--muted);margin-bottom:3px}
  .sensory-field select,.sensory-field textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12.5px;color:var(--ink)}
  .sensory-chips{display:flex;flex-wrap:wrap;gap:5px}
  .sensory-chip{border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:13px;padding:4px 8px;font-size:11.5px;font-weight:700}
  .sensory-chip.on{background:var(--pos-bg);border-color:var(--pos-line);color:var(--pos)}

  /* 外科術後照護組套：精簡、循環點擊與滑桿 */
  .postop-area{margin:8px 12px 0}
  .postop-head{display:flex;align-items:center;gap:10px;padding:2px 2px 6px}
  .postop-title{flex:1;font-weight:800;font-size:14px;color:var(--ink2)}
  .postop-card{background:#fff;border:1px solid #b8d8cd;border-left:4px solid #2f7a5b;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px}
  .postop-bhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#eef8f3}
  .postop-btitle{flex:1;font-weight:800;color:#245f47;font-size:14px}
  .postop-del{border:1px solid #eecdd1;background:#fff;color:var(--danger);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
  .postop-card.collapsed .postop-body{display:none}
  .postop-card.collapsed .chev{transform:rotate(-90deg)}
  .postop-body{padding:8px 10px 11px}
  .po-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .po-field{border:1px solid var(--line2);border-radius:9px;padding:7px;background:#fcfefe;min-width:0}
  .po-field.full{grid-column:1/-1}
  .po-field-top{display:flex;align-items:center;gap:6px;min-height:31px}
  .po-k{font-size:11px;font-weight:800;color:#245f47;min-width:58px;line-height:1.2}
  .po-control{flex:1;min-width:0}
  .po-control input,.po-control textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12.5px;color:var(--ink)}
  .po-note-btn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;width:28px;height:28px;padding:0;flex:none;font-size:12px}
  .po-note-btn.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-d)}
  .po-note{display:none;width:100%;margin-top:6px;padding:7px 8px;border:1px solid var(--primary);border-radius:7px;background:#fbfdfd;font-size:12px}
  .po-note.show{display:block}
  .po-cycle{width:100%;min-height:31px;border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:16px;padding:5px 8px;font-size:11.5px;font-weight:800;line-height:1.2;text-align:center}
  .po-cycle.norm{background:#eef8f0;border-color:#9fd3ab;color:#2f7a43}
  .po-cycle.warn{background:var(--pos-bg);border-color:var(--pos-line);color:var(--pos)}
  .po-cycle.danger{background:#fbeaec;border-color:#dc9fa7;color:var(--danger)}
  .po-date-wrap{display:flex;align-items:center;gap:7px}
  .po-date-wrap input{flex:1;min-width:0}
  .po-pod{flex:none;border-radius:14px;padding:5px 9px;background:var(--primary-soft);color:var(--primary-d);font-size:11.5px;font-weight:800;white-space:nowrap}
  .po-pod.empty{background:#f2f5f6;color:var(--muted)}
  .po-pod.future{background:#fbeaec;color:var(--danger)}
  .po-range{display:flex;align-items:center;gap:7px}
  .po-range input[type=range]{flex:1;min-width:70px;accent-color:#2f7a5b}
  .po-range-val{font-size:12.5px;font-weight:800;color:#245f47;min-width:38px;text-align:right}
  .po-range-val.warn{color:var(--pos)}
  .po-clear{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;padding:5px 7px;font-size:10.5px;font-weight:700}
  .po-subhead{display:flex;align-items:center;gap:8px;margin:10px 1px 6px;padding-top:8px;border-top:1px solid var(--line2)}
  .po-subtitle{flex:1;font-size:12px;font-weight:800;color:#245f47}
  .po-drain-empty{font-size:12px;color:var(--muted);padding:6px 2px}
  .po-drain{border:1px solid #c7ddd4;border-radius:9px;background:#f9fcfa;padding:7px;margin-top:6px}
  .po-drain-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .po-drain-title{flex:1;font-size:12px;font-weight:800;color:#245f47}
  .po-drain-del{border:1px solid #eecdd1;background:#fff;color:var(--danger);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:700}
  .po-drain-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .po-drain-field{min-width:0}
  .po-drain-field.full{grid-column:1/-1}
  .po-drain-field label{display:block;font-size:10.5px;font-weight:800;color:var(--muted);margin-bottom:3px}
  .po-drain-field input,.po-drain-field textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;color:var(--ink)}
  .po-drain-amount{display:flex;gap:5px;align-items:center}
  .po-drain-amount input{flex:1;min-width:0}
  .po-drain-amount .po-cycle{width:auto;min-width:72px}
  @media(max-width:420px){
    .po-k{min-width:50px;font-size:10.5px}
    .po-cycle{font-size:10.5px;padding:5px 5px}
    .po-note-btn{width:26px;height:26px}
    .po-drain-grid{grid-template-columns:1fr 1fr}
  }

  /* ADL 區塊 */
  .section.adl{border-color:#cddbe6;background:#eef4f9}
  .section.adl .sec-body{background:#f6fafd}
  .adl-in{margin:2px 0}
  .adl-level{padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .adl-level .lab{font-weight:700;font-size:14px;color:var(--ink);flex:none}
  .adl-btn{border:1.5px solid;border-radius:20px;padding:9px 18px;font-size:14px;font-weight:800;flex:none}
  .adl-btn.adl-l0{background:#e2f3e6;border-color:#9fd3ab;color:#2f7a43}
  .adl-btn.adl-l1{background:#fdf3d6;border-color:#e8c96a;color:#8a6a12}
  .adl-btn.adl-l2{background:var(--pos-bg);border-color:var(--pos-line);color:var(--pos)}
  .adl-hint{font-size:11px;color:var(--muted)}
  .adl-note-wrap{padding:4px 14px 12px}
  .adl-note-wrap input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fbfdfd;font-size:13.5px}

  /* LQQOPERA */
  .lqq-area{margin:8px 12px 0}
  .lqq-head{display:flex;align-items:center;gap:10px;padding:2px 2px 6px}
  .lqq-title{flex:1;font-weight:800;font-size:14px;color:var(--ink2)}
  .lqq-block{background:#fff;border:1px solid #d8c7e6;border-left:4px solid #8b5cbf;border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
  .lqq-bhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f7f2fb}
  .lqq-name{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700;background:#fff}
  .lqq-del{border:1px solid #eecdd1;background:#fff;color:#b02a37;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;flex:none}
  .lqq-del:active{background:#fbe2e4}
  .lqq-block .chev{color:var(--muted);font-size:13px;transition:transform .18s}
  .lqq-collapsed .chev{transform:rotate(-90deg)}
  .lqq-collapsed .lqq-body{display:none}
  .lqq-body{padding:8px 12px 12px}
  .lqq-f{padding:7px 0;border-bottom:1px solid var(--line2)}
  .lqq-f:last-child{border-bottom:none}
  .lqq-k{display:block;font-size:12px;font-weight:800;color:#7a4fa8;margin-bottom:5px}
  .lqq-f>input,.lqq-f select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff;margin-top:5px}
  .lqq-f select+input{margin-top:6px}
  .lqq-chips{display:flex;flex-wrap:wrap;gap:6px}
  .qchip{border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:14px;padding:5px 11px;font-size:12.5px;font-weight:700}
  .qchip.on{background:#f0e6f9;border-color:#b98fe0;color:#6b3fa0}
  .lqq-sev{display:flex;align-items:center;gap:12px;margin-top:6px}
  .lqq-sev input[type=range]{flex:1;accent-color:#8b5cbf}
  .sevval{font-size:13px;font-weight:800;color:#6b3fa0;min-width:52px;text-align:right}
  .lqq-sev-clear{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;
    padding:5px 7px;font-size:10.5px;font-weight:700;flex:none}
  .lqq-sev-clear:active{background:var(--line2);color:var(--ink)}
  .adl-care{display:none;padding:4px 14px 12px}
  .adl-care.show{display:block}
  .adl-care .cg-title{font-size:12.5px;font-weight:800;color:var(--ink2);margin:4px 0 8px}
  .adl-pills{display:flex;gap:8px;flex-wrap:wrap}
  .cg-pill{border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;
    padding:7px 14px;font-size:13px;font-weight:700}
  .cg-pill.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-d)}
  .cg-text{margin-top:8px;display:none}
  .cg-text.show{display:block}
  .cg-text input{width:100%;padding:9px 11px;border:1px solid var(--primary);border-radius:9px;background:#fbfdfd;font-size:13.5px}
  .subwrap.show{display:flex}
  .subrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sublab{font-size:12.5px;color:var(--ink2);font-weight:700;min-width:52px}
  .subsel{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
  .subtext,.itemnote{width:100%;padding:9px 11px;border:1px solid var(--line);
    border-radius:var(--radius-s);background:#fbfdfd;color:var(--ink);font-size:13.5px}
  .itemnote{margin-top:8px;display:none}
  .itemnote.show{display:block}
  /* 自動長高文字欄位 */
  textarea.autogrow{font:inherit;line-height:1.4;resize:none;overflow:hidden;
    field-sizing:content;white-space:pre-wrap;word-break:break-word}
  input.autogrow{}

  .grpwrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .item.has-group .item-row{align-items:flex-start}
  .item.has-group > .grpwrap{padding:8px 14px 2px;gap:10px 12px}
  .item.has-group .grpfield{margin-bottom:2px}
  .grpfield{display:flex;align-items:center;gap:4px}
  .grpfield span{font-size:12px;color:var(--muted);font-weight:700}
  .grpfield select{padding:6px 7px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff}
  .grpfield select.abn{border-color:var(--pos-line);background:var(--pos-bg);color:var(--pos)}
  .grptotal{font-size:12.5px;font-weight:800;color:var(--ink2);margin-left:2px}
  .grptotal.abn{color:var(--pos)}

  .gnote{margin:14px 12px 0}
  .gnote-top{margin:8px 12px 4px}

  /* 清單卡片：性別/年齡/主要問題 */
  .pc-demo{font-size:12.5px;color:var(--ink2);margin-top:3px}
  .pc-demo .pc-prob{color:var(--primary-d);font-weight:600}

  /* 紀錄頁可編輯表頭 */
  .pcode-input{font-weight:800;font-size:16px;letter-spacing:.3px;color:var(--ink);
    border:1px solid transparent;background:transparent;padding:6px 6px;border-radius:8px;flex:1;min-width:110px}
  .pcode-input:focus{border-color:var(--line);background:#fff;outline:none}
  .note-sub2{padding:0 14px 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .demo-in{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:13px}
  .demo-age{width:78px}
  .demo-prob{flex:1;min-width:140px}

  /* 區塊配色：ROS 淡綠、PE 淡黃（Focus 維持藍） */
  .section.kind-ros{background:#eef8f0;border-color:#cde6d3}
  .section.kind-ros .sec-body{background:#f6fbf7}
  .section.kind-pe{background:#fdf9ec;border-color:#ece1c1}
  .section.kind-pe .sec-body{background:#fefcf4}

  /* 待辦事項 To-do */
  .todo-section{margin:8px 12px 2px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .todo-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2)}
  .todo-title{flex:1;font-weight:800;font-size:14px;color:var(--ink2)}
  .todo-list{padding:2px 8px 6px}
  .todo-empty{color:var(--muted);font-size:13px;padding:10px 6px}
  .todo-row{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;padding:4px 2px;border-bottom:1px solid var(--line2)}
  .todo-row:last-child{border-bottom:none}
  .todo-row.done .todo-text{text-decoration:line-through;color:var(--muted)}
  .todo-row.imp{background:#fbfdff}
  .todo-star{border:1px solid var(--line);background:#fff;color:#c9ccd1;border-radius:7px;
    width:30px;height:30px;font-size:14px;line-height:1;flex:none;padding:0}
  .todo-star.on{color:#e8a800;border-color:#f0c860;background:#fff8e6}
  .todo-text{flex:1 1 auto;min-width:40px;padding:5px 8px;border:1px solid var(--line);
    border-radius:7px;background:#fff;color:var(--ink);font-size:13.5px;min-height:1.9em}
  .todo-btns{display:flex;gap:3px;flex:none}
  .tb{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;
    padding:5px 0;width:30px;text-align:center;font-size:13px;font-weight:800;line-height:1.1}
  .tb-todo.sel{background:#fdf3d6;border-color:#e8c96a;color:#8a6a12}
  .tb-done.sel{background:#e2f3e6;border-color:#9fd3ab;color:#2f7a43}
  .tb-del{color:#b02a37;border-color:#eecdd1}
  .tb-del:active{background:#fbe2e4}
  .todo-time{flex:none;font-size:9px;color:var(--muted);white-space:nowrap;line-height:1.1;width:38px;text-align:right}
  .gnote label{display:block;font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:6px}
  .gnote textarea{width:100%;min-height:90px;padding:12px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--surface);color:var(--ink);resize:vertical;box-shadow:var(--shadow)}

  /* export menu */
  .menu{position:absolute;top:52px;right:12px;z-index:60;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:0 10px 34px rgba(18,48,61,.18);padding:6px;display:none;min-width:230px}
  .menu.show{display:block}
  .menu button{display:block;width:100%;text-align:left;border:none;background:transparent;
    padding:11px 12px;border-radius:8px;font-size:13.5px;color:var(--ink);font-weight:600}
  .menu button:active{background:var(--primary-soft)}
  .menu .mlabel{font-size:11px;color:var(--muted);font-weight:800;padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.5px}
  .menu .mdiv{height:1px;background:var(--line2);margin:5px 4px}
  .scrim{position:fixed;inset:0;z-index:55;display:none}
  .scrim.show{display:block}

  /* ---- export preview modal ---- */
  .modal{position:fixed;inset:0;z-index:70;display:none;background:rgba(18,48,61,.45);
    align-items:flex-end;justify-content:center;padding:0}
  .modal.show{display:flex}
  .modal-card{background:#fff;width:100%;max-width:760px;max-height:92vh;border-radius:16px 16px 0 0;
    display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(18,48,61,.3)}
  @media(min-width:620px){ .modal{align-items:center;padding:20px} .modal-card{border-radius:16px;max-height:88vh} }
  .modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .modal-head .mt{flex:1;font-weight:800;font-size:15px}
  .modal-head .mx{border:none;background:transparent;font-size:22px;color:var(--muted);width:38px;height:38px;border-radius:9px;line-height:1}
  .modal-head .mx:active{background:var(--line2)}
  .modal-scroll{flex:1;overflow:auto;padding:16px;background:#f6f9fa}
  .modal-foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .modal-foot .btn{flex:1;justify-content:center;min-width:120px}
  .txtprev{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang TC","Noto Sans TC",monospace;
    font-size:12.5px;line-height:1.6;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
  /* on-screen document preview (mirrors print) */
  .docprev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;color:#111}
  .docprev .pr-h{border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}
  .docprev .pr-h h1{font-size:18px;margin:0 0 4px}
  .docprev .pr-meta{font-size:12.5px;color:#444}
  .docprev .pr-sec{margin:0 0 12px}
  .docprev .pr-sec h2{font-size:14px;margin:0 0 4px;padding:3px 0;border-bottom:1px solid #bbb}
  .docprev .pr-line{font-size:12.5px;padding:2px 0;line-height:1.5}
  .docprev .pr-line .k{font-weight:700}
  .docprev .pr-line i{color:var(--pos);font-style:normal}
  .docprev .pr-note{white-space:pre-wrap;font-size:12.5px;border:1px solid #bbb;padding:8px;border-radius:6px}

  .hidden{display:none!important}

  /* toast */
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;
    font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* print */
  #printArea{display:none}
  @media print{
    body{background:#fff}
    .wrap>*{display:none!important}
    #printArea{display:block!important;padding:0;color:#000}
    .pr-h{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
    .pr-h h1{font-size:19px;margin:0 0 4px}
    .pr-meta{font-size:12.5px;color:#333}
    .pr-sec{margin:0 0 12px;break-inside:avoid}
    .pr-sec h2{font-size:14px;margin:0 0 4px;padding:3px 0;border-bottom:1px solid #999}
    .pr-line{font-size:12.5px;padding:2px 0;line-height:1.45}
    .pr-line .k{font-weight:700}
    .pr-line.pos .k{color:#000}
    .pr-note{white-space:pre-wrap;font-size:12.5px;border:1px solid #999;padding:8px;border-radius:6px}
    @page{margin:14mm}
  }

  /* ==================================================================
     組套介面：主題淡色＋一致的資訊階層
     LQQOPERA 淡綠、術後淡紅、化療／標靶淡紫
     ================================================================== */
  .bundle-launcher{margin:8px 12px 2px;padding:11px 12px 12px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .bundle-launcher-title{font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:.2px;margin-bottom:8px}
  .bundle-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .bundle-btn{min-width:0;border:1px solid var(--line);background:#fff;color:var(--ink2);
    border-radius:9px;padding:8px 5px;font-size:11.7px;font-weight:750;line-height:1.2;text-align:center}
  .bundle-btn:active{transform:translateY(1px)}
  .bundle-btn.lqq-btn{background:#f1f9f3;border-color:#cfe5d4;color:#356b46}
  .bundle-btn.postop-btn{background:#fdf1f2;border-color:#e8cbd0;color:#8a4650}
  .bundle-btn.chemo-btn{background:#f6f0fb;border-color:#ddcdea;color:#6d4c87}
  .bundle-btn.lqq-btn:active{background:#e7f5ea;border-color:#9fcaaa}
  .bundle-btn.postop-btn:active{background:#f9e5e7;border-color:#dbaab1}
  .bundle-btn.chemo-btn:active{background:#eee3f7;border-color:#c4a8da}
  .bundle-btn.exists{opacity:.58;cursor:default;filter:saturate(.65)}
  .bundle-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;
    margin-left:4px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.72);color:inherit;
    border:1px solid currentColor;font-size:10px;font-weight:800;vertical-align:middle}

  .lqq-area,.postop-area,.chemo-area{margin:10px 12px 0}
  .lqq-head,.postop-head{display:none!important}
  .lqq-block,.postop-card,.chemo-card{border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;margin-bottom:10px;border:1px solid var(--line)}

  /* LQQOPERA：淡綠 */
  .lqq-block{background:#f8fcf9;border-color:#cfe5d4}
  .lqq-bhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#edf8f0;
    border-bottom:1px solid #d8eadc}
  .lqq-body{background:#fbfefc}
  .lqq-name{flex:1;border:1px solid transparent;background:transparent;color:#274c32;
    border-radius:8px;padding:6px 8px;font-size:14px;font-weight:750;min-width:0}
  .lqq-name:focus{border-color:#b7d6bf;background:#fff;outline:none}
  .lqq-k{color:#3d7650}
  .lqq-block .qchip.on{background:#e6f4e9;border-color:#9fcaaa;color:#356b46}
  .lqq-sev input[type=range]{accent-color:#4f8a60}
  .lqq-block .sevval{color:#356b46}

  /* 術後：淡紅 */
  .postop-card{background:#fffafa;border-color:#e8cbd0}
  .postop-bhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fbecef;
    border-bottom:1px solid #efd7db}
  .postop-btitle{flex:1;font-weight:800;color:#7f3f49;font-size:14px}
  .postop-body{background:#fffafa;padding:8px 10px 11px}
  .postop-card .po-field{background:rgba(255,255,255,.88);border-color:#f0dfe2}
  .postop-card .po-k,.postop-card .po-subtitle,.postop-card .po-drain-title{color:#80505a}
  .postop-card .po-note-btn.active{background:#fbecef;border-color:#d9aeb5;color:#8a4650}
  .postop-card .po-pod{background:#f8e4e7;color:#8a4650}
  .postop-card .po-range input[type=range]{accent-color:#b96875}
  .postop-card .po-range-val{color:#8a4650}
  .postop-card .po-drain{border-color:#efd7db;background:#fffdfd}
  .postop-card.collapsed .postop-body{display:none}
  .postop-card.collapsed .chev{transform:rotate(-90deg)}

  /* 化療／標靶：淡紫 */
  .chemo-card{background:#fcf9fe;border-color:#ddcdea}
  .chemo-bhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f3ebf9;
    border-bottom:1px solid #e5d9ef}
  .chemo-btitle{flex:1;font-weight:800;color:#66477e;font-size:14px}
  .chemo-body{background:#fcf9fe;padding:8px 10px 11px}
  .chemo-card .po-field{background:rgba(255,255,255,.9);border-color:#eadff2}
  .chemo-card .po-k,.chemo-k{color:#6d5381}
  .chemo-card .po-note-btn.active{background:#f1e8f8;border-color:#c6add9;color:#6d4c87}
  .chemo-card .chemo-day{background:#eee3f7;color:#6d4c87}
  .chemo-card.collapsed .chemo-body{display:none}
  .chemo-card.collapsed .chev{transform:rotate(-90deg)}

  .lqq-del,.postop-del,.chemo-del{border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--muted);
    border-radius:8px;padding:5px 8px;font-size:11.5px;font-weight:700;flex:none}
  .lqq-del:active,.postop-del:active,.chemo-del:active{background:#fbeaec;border-color:#eecdd1;color:var(--danger)}

  /* 多重問題：正常狀態互斥，異常狀態可複選 */
  .multi-chips{display:flex;flex-wrap:wrap;gap:5px}
  .multi-chip{border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:13px;
    padding:5px 8px;font-size:11px;font-weight:700;line-height:1.15;text-align:left}
  .multi-chip.on{font-weight:800}
  .multi-chip.norm.on{background:#eef8f0;border-color:#9fd3ab;color:#2f7a43}
  .multi-chip.warn.on{background:var(--pos-bg);border-color:var(--pos-line);color:var(--pos)}
  .multi-chip.danger.on{background:#fbeaec;border-color:#dc9fa7;color:var(--danger)}
  .postop-card .multi-chip.on:not(.norm):not(.warn):not(.danger){background:#f9e8eb;border-color:#dbaab1;color:#8a4650}
  .chemo-card .multi-chip.on:not(.norm):not(.warn):not(.danger){background:#eee3f7;border-color:#c4a8da;color:#6d4c87}
  .multi-group{display:flex;flex-direction:column;gap:7px}
  .multi-subrow{display:flex;align-items:flex-start;gap:7px}
  .multi-subkey{font-size:10.5px;font-weight:800;color:var(--muted);width:48px;flex:none;padding-top:5px}
  .multi-subcontrol{flex:1;min-width:0}

  /* 共用緊湊欄位 */
  .po-field{border:1px solid var(--line2);border-radius:9px;padding:7px;background:#fff;min-width:0}
  .po-note-btn{background:#fff}
  .po-cycle{border-color:var(--line);border-radius:9px;font-weight:750}
  .po-cycle.norm{background:#eef8f0;border-color:#9fd3ab;color:#2f7a43}
  .po-cycle.warn{background:var(--pos-bg);border-color:var(--pos-line);color:var(--pos)}
  .po-cycle.danger{background:#fbeaec;border-color:#dc9fa7;color:var(--danger)}
  .po-pod.empty,.chemo-day.empty,.chemo-temp-state.empty{background:#f2f5f6!important;color:var(--muted)!important}
  .po-pod.future,.chemo-day.future,.chemo-temp-state.danger{background:#fbeaec!important;color:var(--danger)!important}
  .chemo-temp-state.norm{background:#eef8f0;color:#2f7043}

  /* 體溫獨立滿版列 */
  .chemo-temp-field{grid-column:1/-1;padding:9px 8px}
  .chemo-temp-field .po-field-top{min-height:38px}
  .chemo-temp-field .po-k{font-size:12px;min-width:70px}
  .chemo-temp-wrap{display:flex;align-items:center;gap:8px}
  .chemo-temp-wrap input{flex:1;min-width:0;font-size:16px!important;font-weight:750;text-align:center}
  .chemo-date-wrap{display:flex;align-items:center;gap:7px}
  .chemo-date-wrap input{flex:1;min-width:0}
  .chemo-day,.chemo-temp-state{flex:none;border-radius:14px;padding:5px 9px;font-size:11.5px;
    font-weight:800;white-space:nowrap}

/* ---------- 儲存層（雙模式）----------
   在 Claude artifact 內：用 window.storage（每位觀看者各自持久化，跨 session 保留）
   下載成檔 / 自架網站：用 localStorage（每台裝置各自持久化）
   兩者都不可用：記憶體（重整即清空）

const KEY = "rounding_notes_v1";
const mem = {data:null};
const hasWinStore = (typeof window!=="undefined" && window.storage && typeof window.storage.get==="function");
const Store = {
  async read(){
    if(hasWinStore){
      try{ const r=await window.storage.get(KEY, false); return (r&&r.value)?JSON.parse(r.value):null; }
      catch(e){ return null; }  // 不存在的 key 會 throw，視為 null
    }
    try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }
    catch(e){ return mem.data; }
  },
  write(v){
    mem.data = v;
    if(hasWinStore){ try{ window.storage.set(KEY, JSON.stringify(v), false); }catch(e){} return; }
    try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){}
  }
};

function S(id,label,en,opts,normal,star,fu,fuOn){ return {id,type:"select",label,en:en||"",opts,normal,star:!!star,fu:fu||null,fuOn:fuOn||null}; }

// text：純文字/數值欄位

// custom：自訂 widget（DTR 格點、Babinski 分邊…），render/export 由 custom 類型分派

function effectiveFocusIds(p,spec){
  const ids=[...((spec&&spec.focus)||[])];
  return ids.filter(id=>!(id==="pe_sensory" && p && p.specialty!=="neuro"));
}

function sectionVisible(secDef,p){
  const g=secDef.gate;
  if(!g) return true;
  const female = (p.sex==="女 F");
  if(g==="gyn") return female || p.specialty==="gyn" || p.specialty==="obs"; // 任何女性、或婦/產科
  if(g==="obs") return p.specialty==="obs";                                   // 產科（懷孕情境）
  return true;
}
function itemVisible(item,p){
  const rec=ITEM_INDEX[item.id]; if(!rec) return true;
  return sectionVisible(rec.sec,p);
}

function fmtTime(ts){
  const d=new Date(ts), p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;

}

/* ---------- 每一項目狀態存取 ---------- */
function vOf(p,id){ if(!p.values[id]) p.values[id]={}; return p.values[id]; }

/* 判斷「有異常/需記錄」 */
function hasFinding(p,it){
  const v=p.values[it.id]||{};
  if(it.type==="toggle") { if(v.on) return true; }
  else if(it.type==="select"){ if(v.sel && v.sel!==it.normal) return true; }
  else if(it.type==="group"){ if(it.fields.some(f=>{const g=(v.grp||{})[f.id]; return g && g!==f.normal;})) return true; }
  else if(it.type==="text"){ if(v.text && v.text.trim()) return true; }
  else if(it.type==="custom"){
    if(it.custom==="dtr"){ const d=v.dtr||{}; if(Object.keys(d).some(k=>d[k] && d[k]!=="2+")) return true; }
    if(it.custom==="plantar"){ const pl=v.plantar||{}; if(["L","R"].some(s=>pl[s] && pl[s]!==PLANTAR_OPTS[0])) return true; }
    if(it.custom==="sensory"){ const s=v.sensory||{}; if(s.status==="異常 Abnormal") return true; }
  }
  if(it.cnPanel){ const cn=v.cn||{}; if(Object.keys(cn).some(k=>cn[k] && (cn[k].abn || (cn[k].note&&cn[k].note.trim())))) return true; }
  if(v.note && v.note.trim()) return true;
  return false;
}

function drawList(){

}

function countPositives(p){
  let n=0;
  SECTIONS.forEach(sec=>{ if(!sectionVisible(sec,p)) return; sec.items.forEach(it=>{ if(hasFinding(p,it)) n++; }); });
  return n;
}

/* ---------- 待辦事項 ---------- */
function fmtShort(ts){ const d=new Date(ts),p=n=>String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function sortedTodos(){
  const arr=[...(CUR.todos||[])];
  const tier=t=> t.status==="done"?2:(t.important?0:1);   // 重要 → 一般待辦 → 已完成
  arr.sort((a,b)=> tier(a)-tier(b) || a.createdAt-b.createdAt); // 同層：舊 → 新
  return arr;
}
function addTodo(){
  if(!CUR.todos) CUR.todos=[];
  const t={id:"td"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    text:"", createdAt:Date.now(), important:false, status:"todo"};
  CUR.todos.push(t); touch(); renderTodos(t.id);
}
function renderTodos(focusId){
  const list=$("#todoList"); if(!list) return;
  const arr=sortedTodos();
  if(arr.length===0){ list.innerHTML=`<div class="todo-empty">尚無待辦，點「＋ 新增」開始</div>`; return; }
  list.innerHTML="";
  arr.forEach(t=>{
    const row=document.createElement("div");
    row.className="todo-row"+(t.status==="done"?" done":"")+((t.important&&t.status!=="done")?" imp":"");
    row.innerHTML=`
      <button class="todo-star ${t.important?"on":""}" title="重要">★</button>
      <textarea class="todo-text autogrow" rows="1" placeholder="待辦內容…">${escapeHtml(t.text)}</textarea>
      <div class="todo-btns">
        <button class="tb tb-todo ${t.status==="todo"?"sel":""}" data-st="todo" title="待辦">待</button>
        <button class="tb tb-done ${t.status==="done"?"sel":""}" data-st="done" title="完成">完</button>
        <button class="tb tb-del" data-st="del" title="刪除">✕</button>
      </div>
      <span class="todo-time">${fmtShort(t.createdAt)}</span>`;
    row.querySelector(".todo-star").onclick=()=>{ t.important=!t.important; touch(); renderTodos(); };
    const txt=row.querySelector(".todo-text");
    txt.addEventListener("input",()=>{ t.text=txt.value; touch(); }); // 即時儲存、不重繪以保留游標
    row.querySelectorAll("[data-st]").forEach(b=>{
      b.onclick=()=>{
        const st=b.getAttribute("data-st");
        if(st==="del"){ CUR.todos=CUR.todos.filter(x=>x.id!==t.id); touch(); renderTodos(); return; }
        t.status=st; touch(); renderTodos();
      };
    });
    list.appendChild(row);
    if(focusId && t.id===focusId) txt.focus();
  });
  resizeAutogrow(list);
}

function renderItem(it){
  const p=CUR, v=vOf(p,it.id);
  const el=document.createElement("div");
  el.className="item"; el.dataset.item=it.id;

  const enText = it.en || it.label;        // 英文為主（無 en 時 label 本身即英文/術語）
  const zhText = it.en ? it.label : "";    // 有 en 時 label 為中文副標
  const labelHtml=`<div class="item-label"><span class="lab-en">${escapeHtml(enText)}${it.star?'<span class="star">★</span>':""}</span>${zhText?`<span class="lab-zh">${escapeHtml(zhText)}</span>`:""}</div>`;

  let control="";
  if(it.type==="toggle"){
    control=`<button class="toggle ${v.on?"on":""}" data-toggle>${v.on?"(+) 陽性":"(−) 陰性"}</button>`;
  }else if(it.type==="select"){
    control=selectHtml(it,v.sel);
  }else if(it.type==="group"){
    control=""; // 群組另起一行
  }else if(it.type==="custom"){
    control=""; // 自訂 widget 另起一行
  }else if(it.type==="text"){
    control=`<textarea class="isel autogrow" style="max-width:56%" rows="1" data-textfield placeholder="輸入">${escapeHtml(v.text||"")}</textarea>`;
  }

  if(it.type==="group"||it.type==="custom") el.classList.add("has-group");

  el.innerHTML=`<div class="item-row">
      ${labelHtml}
      ${control}
      <button class="notebtn ${v.note?"active":""}" data-notebtn title="備註">✎</button>
    </div>`;

  // group / custom 內容：獨立整行
  if(it.type==="group"){
    el.appendChild(buildGroup(it,v));
  }else if(it.type==="custom"){
    el.appendChild(buildCustom(it,v));
  }

  // follow-up 容器（toggle 陽性、或 select 選到觸發值時展開）
  if((it.type==="toggle"||it.type==="select") && it.fu){
    const sub=buildFollowUps(it,v);
    el.appendChild(sub);
    const open = it.type==="toggle" ? !!v.on : (v.sel===it.fuOn);
    if(open) sub.classList.add("show");
  }

  // 顱神經詳細面板
  if(it.cnPanel){
    const panel=buildCNPanel(it,v);
    el.appendChild(panel);
    if(v.sel===it.cnOn) panel.classList.add("show");
  }

  // 備註欄
  const noteInput=document.createElement("textarea");
  noteInput.className="itemnote autogrow"+(v.note?" show":"");
  noteInput.rows=1;
  noteInput.setAttribute("data-noteinput","");
  noteInput.placeholder="敘述 / 備註";
  noteInput.value=v.note||"";
  el.appendChild(noteInput);

  wireItem(el,it);
  applyItemHitClass(el,it);
  return el;
}

function buildFollowUps(it,v){

      const s=get(); s.abn=!s.abn;
      if(!s.abn){ s.grid={}; s.mono=[]; s.note="";
        row.querySelectorAll(".cng-cell.on").forEach(c=>{c.classList.remove("on");c.textContent="";});
        row.querySelectorAll(".cn-chip.on").forEach(c=>c.classList.remove("on"));
        row.querySelector("[data-cnnote]").value=""; }
      tog.classList.toggle("on",s.abn); tog.textContent=s.abn?"異常":"正常";
      row.classList.toggle("abn",s.abn); detail.classList.toggle("show",s.abn);
      touch();
    };
    row.querySelectorAll("[data-cell]").forEach(c=>{
      c.onclick=()=>{ const s=get(); const key=c.getAttribute("data-cell");
        s.grid[key]=!s.grid[key]; c.classList.toggle("on",s.grid[key]); c.textContent=s.grid[key]?"✓":""; touch(); };
    });
    row.querySelectorAll("[data-cm]").forEach(b=>{
      b.onclick=()=>{ const s=get(); const m=b.getAttribute("data-cm");
        const i=s.mono.indexOf(m); if(i>=0)s.mono.splice(i,1); else s.mono.push(m);
        b.classList.toggle("on"); touch(); };
    });
    const note=row.querySelector("[data-cnnote]");
    note.addEventListener("input",()=>{ get().note=note.value; touch(); });
    panel.appendChild(row);
  });
  return panel;
}

/* ---------- 自訂 widget：DTR 格點、Babinski 分邊 ---------- */
const DTR_SITES=[
  {k:"biceps",l:"Biceps 肱二頭肌"},{k:"triceps",l:"Triceps 肱三頭肌"},
  {k:"brachi",l:"Brachioradialis 肱橈肌"},{k:"knee",l:"Knee 膝反射"},{k:"ankle",l:"Ankle 踝反射"},
];
const DTR_GRADES=["","0","1+","2+","3+","4+"];
const PLANTAR_OPTS=["屈曲↓ (正常)","伸直↑ Babinski(+)","無反應"];

const SENSORY_STATUS=["","正常 Intact","異常 Abnormal"];
const SENSORY_SIDES=["左上肢 LUE","右上肢 RUE","雙上肢 Bilateral UE","左手 L hand","右手 R hand","左下肢 LLE","右下肢 RLE","雙下肢 Bilateral LE","左足 L foot","右足 R foot","軀幹 Trunk","顏面 Face","其他 Other"];
const SENSORY_CHANGES=["感覺減退 Hypoesthesia","感覺消失 Anesthesia","感覺增強 Hyperesthesia","異感 Paresthesia","痛覺過敏 Hyperalgesia","觸痛 Allodynia"];
const SENSORY_PATTERNS=["皮節 Dermatomal","周邊神經 Peripheral nerve","襪套/手套 Stocking-glove","半身 Hemisensory","散在/斑片 Patchy","其他 Other"];
const SENSORY_MODALITIES=["輕觸 Light touch","針刺/痛覺 Pinprick","溫度 Temperature","震動 Vibration","本體覺 Proprioception"];
function sensoryState(v){
  if(!v.sensory){
    v.sensory={status:v.sel||"",findings:[]};
    if(v.sel==="異常 Abnormal" && v.fu){
      const mods=v.fu.sens_mod?[v.fu.sens_mod]:[];
      v.sensory.findings.push({id:"sf"+Date.now().toString(36),side:"",change:"感覺減退 Hypoesthesia",pattern:"",modalities:mods,location:v.fu.sens_loc||"",note:""});
    }
  }
  if(!Array.isArray(v.sensory.findings))v.sensory.findings=[];
  return v.sensory;
}
function newSensoryFinding(){return {id:"sf"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),side:"",change:"",pattern:"",modalities:[],location:"",note:""};}
function buildSensory(it,v){
  const s=sensoryState(v), wrap=document.createElement("div"); wrap.className="sensory-wrap";
  wrap.innerHTML=`<div class="sensory-top"><button class="icycle ${s.status==="異常 Abnormal"?"abn":(s.status?"norm":"")}" data-sens-status>${escapeHtml(s.status||"未評估")}</button>

  const list=wrap.querySelector("[data-sens-list]"), addBtn=wrap.querySelector("[data-sens-add]"), statusBtn=wrap.querySelector("[data-sens-status]");

  const draw=()=>{
    list.innerHTML="";
    if(!s.findings.length){list.innerHTML='<div class="sensory-empty">尚無異常紀錄，請按「新增異常」。</div>';return;}
    s.findings.forEach((f,idx)=>{
      if(!Array.isArray(f.modalities))f.modalities=[];
      const e=document.createElement("div"); e.className="sensory-entry";
      const opts=(arr,cur)=>`<option value="">—</option>${arr.map(o=>`<option value="${escapeHtml(o)}" ${o===cur?"selected":""}>${escapeHtml(o)}</option>`).join("")}`;
      e.innerHTML=`<div class="sensory-ehead"><span class="sensory-num">異常 ${idx+1}</span><button class="sensory-del" data-sf-del>刪除</button></div>
        <div class="sensory-grid">
          <div class="sensory-field"><label>側別 / 部位</label><select data-sf="side">${opts(SENSORY_SIDES,f.side||"")}</select></div>
          <div class="sensory-field"><label>異常性質</label><select data-sf="change">${opts(SENSORY_CHANGES,f.change||"")}</select></div>
          <div class="sensory-field"><label>分布型態</label><select data-sf="pattern">${opts(SENSORY_PATTERNS,f.pattern||"")}</select></div>
          <div class="sensory-field full"><label>感覺模態（可複選）</label><div class="sensory-chips">${SENSORY_MODALITIES.map(m=>`<button class="sensory-chip ${f.modalities.includes(m)?"on":""}" data-sf-mod="${escapeHtml(m)}">${escapeHtml(m)}</button>`).join("")}</div></div>
          <div class="sensory-field full"><label>精確分布 / 皮節 / 周邊神經</label><textarea rows="1" class="autogrow" data-sf="location" placeholder="例：左 L4 輕觸減退；左 S1 震動覺消失">${escapeHtml(f.location||"")}</textarea></div>
          <div class="sensory-field full"><label>此筆註記</label><textarea rows="1" class="autogrow" data-sf="note" placeholder="比較基準、遠近端差異、檢查限制…">${escapeHtml(f.note||"")}</textarea></div>
        </div>`;
      e.querySelector("[data-sf-del]").onclick=()=>{s.findings=s.findings.filter(x=>x.id!==f.id);draw();refresh();};
      e.querySelectorAll("[data-sf]").forEach(inp=>{const k=inp.getAttribute("data-sf"),ev=inp.tagName==="SELECT"?"change":"input";inp.addEventListener(ev,()=>{f[k]=inp.value;refresh();});});
      e.querySelectorAll("[data-sf-mod]").forEach(ch=>{ch.onclick=()=>{const m=ch.getAttribute("data-sf-mod"),ix=f.modalities.indexOf(m);if(ix>=0)f.modalities.splice(ix,1);else f.modalities.push(m);ch.classList.toggle("on",f.modalities.includes(m));refresh();};});

    const on=s.status==="異常 Abnormal"; list.classList.toggle("show",on); addBtn.classList.toggle("show",on); draw(); refresh();
  };
  addBtn.onclick=()=>{
    s.status="異常 Abnormal";
    statusBtn.textContent=s.status;statusBtn.className="icycle abn";
    list.classList.add("show");addBtn.classList.add("show");
    s.findings.push(newSensoryFinding());draw();refresh();
    const last=list.lastChild,sel=last&&last.querySelector("select");if(sel)sel.focus();
  };
  draw(); return wrap;
}
function buildCustom(it,v){

function buildDTR(it,v){

  DTR_SITES.forEach(s=>{ html+=`<div class="dtr-row"><span class="dtr-site">${s.l}</span>${cellHtml(s.k+"_L")}${cellHtml(s.k+"_R")}</div>`; });

function wireItem(el,it){
  const p=CUR, v=vOf(p,it.id);

  const tgl=el.querySelector("[data-toggle]");
  if(tgl){
    tgl.addEventListener("click",()=>{
      v.on=!v.on;
      tgl.classList.toggle("on",v.on);
      tgl.textContent=v.on?"(+) 陽性":"(−) 陰性";
      const sub=el.querySelector(".subwrap"); if(sub) sub.classList.toggle("show",v.on);
      applyItemHitClass(el,it); touch(); refreshCountFor(el);
    });
  }

  const cyc=el.querySelector("[data-cycle]");
  if(cyc){
    cyc.addEventListener("click",()=>{
      const cycle=["",...it.opts];
      let idx=cycle.indexOf(v.sel||"");
      v.sel=cycle[(idx+1)%cycle.length];
      const abn=v.sel && v.sel!==it.normal;
      cyc.textContent=v.sel||"未評估";
      cyc.className="icycle "+(abn?"abn":(v.sel?"norm":""));
      if(it.fu){ const sub=el.querySelector(".subwrap"); if(sub) sub.classList.toggle("show", v.sel===it.fuOn); }
      if(it.cnPanel){ const cp=el.querySelector(".cnpanel"); if(cp) cp.classList.toggle("show", v.sel===it.cnOn); }
      applyItemHitClass(el,it); touch(); refreshCountFor(el);
    });
  }

  el.querySelectorAll("[data-grp]").forEach(gs=>{
    gs.addEventListener("input",()=>{
      if(!v.grp)v.grp={};
      const fid=gs.getAttribute("data-grp");
      v.grp[fid]=gs.value;
      const f=it.fields.find(x=>x.id===fid);
      const fld=gs.closest(".grow-field");
      if(fld){ fld.classList.toggle("abn", gs.value!==f.normal); const vs=fld.querySelector(".gf-val"); if(vs) vs.textContent=gs.value; }
      updateGroupTotal(el,it,v);
      applyItemHitClass(el,it); touch(); refreshCountFor(el);
    });
  });
  el.querySelectorAll("[data-grp-clear]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(!v.grp)v.grp={};
      const fid=btn.getAttribute("data-grp-clear"), f=it.fields.find(x=>x.id===fid);
      delete v.grp[fid];
      const fld=btn.closest(".grow-field"), slider=fld&&fld.querySelector(`[data-grp="${fid}"]`), vs=fld&&fld.querySelector(".gf-val");
      if(slider)slider.value=f.normal; if(vs)vs.textContent="—"; if(fld)fld.classList.remove("abn");
      updateGroupTotal(el,it,v); applyItemHitClass(el,it); touch(); refreshCountFor(el);
    });
  });
  if(it.type==="group") updateGroupTotal(el,it,v);

  const tf=el.querySelector("[data-textfield]");
  if(tf){
    tf.addEventListener("input",()=>{ v.text=tf.value; applyItemHitClass(el,it); touch(); refreshCountFor(el); });
  }

  el.querySelectorAll("[data-fu]").forEach(f=>{
    const fid=f.getAttribute("data-fu");
    const ev = f.tagName==="SELECT"?"change":"input";
    f.addEventListener(ev,()=>{ if(!v.fu)v.fu={}; v.fu[fid]=f.value; touch(); });
  });
  el.querySelectorAll("[data-futoggle]").forEach(b=>{
    const fid=b.getAttribute("data-futoggle");
    b.addEventListener("click",()=>{
      if(!v.fu)v.fu={};
      const on=v.fu[fid]==="1"; v.fu[fid]=on?"":"1";
      b.classList.toggle("on",!on);
      const base=b.textContent.replace(/\s*\(\+\)\s*$/,"").trim();
      b.textContent = !on?base+" (+)":base;
      touch();
    });
  });

  const nb=el.querySelector("[data-notebtn]");
  const ni=el.querySelector("[data-noteinput]");
  nb.addEventListener("click",()=>{
    const show=ni.classList.toggle("show");

  });
  ni.addEventListener("input",()=>{
    v.note=ni.value;
    nb.classList.toggle("active", ni.classList.contains("show")|| !!v.note);
    applyItemHitClass(el,it); touch(); refreshCountFor(el);
  });
}

function toggleMenu(){ const m=$("#exportMenu"); const open=m.classList.toggle("show"); scrim.classList.toggle("show",open); }

/* =======================================================================
   匯出：文字模型 → TXT / PDF(列印)
   ======================================================================= */
function labelPlain(it){ return it.en ? `${it.en}（${it.label}）` : it.label; }

function fuParts(it,v){
  const parts=[];
  (it.fu||[]).forEach(f=>{
    const fv=(v.fu||{})[f.id];
    if(f.type==="toggle"){ if(fv==="1") parts.push(f.label+"(+)"); }
    else if(fv && String(fv).trim()){ parts.push(`${f.label}: ${fv}`); }
  });
  return parts;
}
function itemLine(it){
  const v=CUR.values[it.id]||{};
  let val="", pos=false;
  if(it.type==="toggle"){
    pos=!!v.on;
    val = pos?"(+) 陽性":"(−) 陰性";
    if(pos && it.fu){ const parts=fuParts(it,v); if(parts.length) val += "｜"+parts.join("；"); }
  }else if(it.type==="select"){
    val = v.sel || "未評估";
    pos = v.sel && v.sel!==it.normal;
    if(it.fu && v.sel===it.fuOn){ const parts=fuParts(it,v); if(parts.length) val += "｜"+parts.join("；"); }
    if(it.cnPanel){
      const cn=v.cn||{}; const parts=[];
      it.cnPanel.forEach(n=>{ const s=cn[n.id]; if(s&&s.abn){
        const seg=[];
        (n.sides||[]).forEach(sd=>{ const g=s.grid||{}; const sides=[g[sd.k+"_L"]?"L":"",g[sd.k+"_R"]?"R":""].filter(Boolean).join("/"); if(sides) seg.push(`${sd.l}(${sides})`); });
        (s.mono||[]).forEach(m=>seg.push(m));
        if(s.note&&s.note.trim()) seg.push(s.note.trim());
        parts.push(n.label+(seg.length?`：${seg.join("、")}`:"：異常")); } });
      if(parts.length){ val += "｜異常 → "+parts.join("；"); pos=true; }
    }
  }else if(it.type==="custom"){
    if(it.custom==="dtr"){
      const d=v.dtr||{}; const parts=[]; let any=false, abn=false;
      DTR_SITES.forEach(s=>{ const L=d[s.k+"_L"]||"", R=d[s.k+"_R"]||"";
        if(L||R){ any=true; parts.push(`${s.l.split(" ")[0]} L${L||"–"}/R${R||"–"}`); if((L&&L!=="2+")||(R&&R!=="2+"))abn=true; } });
      val = any? parts.join("；") : "未評估"; pos=abn;
    }else if(it.custom==="plantar"){
      const pl=v.plantar||{}; const L=pl.L||"未評估", R=pl.R||"未評估";
      val = `左 ${L} / 右 ${R}`;
      pos = (pl.L&&pl.L!==PLANTAR_OPTS[0])||(pl.R&&pl.R!==PLANTAR_OPTS[0]);
    }else if(it.custom==="sensory"){
      const s=v.sensory||{}; val=s.status||"未評估"; pos=s.status==="異常 Abnormal";
      if(pos && (s.findings||[]).length){
        const fs=(s.findings||[]).map((f,i)=>{const a=[f.side,f.change,(f.modalities||[]).join("/"),f.pattern,f.location].filter(Boolean);if(f.note&&f.note.trim())a.push("註："+f.note.trim());return `#${i+1} ${a.join("｜")||"未描述"}`;});
        val += "｜"+fs.join("；");
      }
    }
  }else if(it.type==="group"){
    const g=v.grp||{};
    const parts=it.fields.map(f=>`${f.label}${g[f.id]||"–"}`);
    let s=parts.join("");
    if(it.total && it.fields.every(f=>g[f.id])){
      const sum=it.fields.reduce((a,f)=>a+parseInt(g[f.id],10),0);
      s+=` (${sum})`;
    }
    val=s;
    pos=it.fields.some(f=>g[f.id] && g[f.id]!==f.normal);
  }else if(it.type==="text"){
    val = v.text && v.text.trim() ? v.text : "—";
    pos = v.text && v.text.trim();
  }
  const note = (v.note&&v.note.trim())?`　※${v.note.trim()}`:"";
  return {label:labelPlain(it), val, pos:!!pos, note, hasNote:!!(v.note&&v.note.trim())};
}

/* 建立匯出模型：limited=true 只留 Focus∪異常∪備註 */
function buildModel(limited){
  const p=CUR;
  const bn=p.blockNotes||{};
  const spec=SPEC_INDEX[p.specialty]||SPEC_INDEX.general;
  const focusIds=effectiveFocusIds(p,spec);
  const focusSet=new Set(focusIds);
  const alwaysKeys=new Set(["ros_const","pe_general"]); // 限縮版也整段匯出
  const out=[];

  lqqModels(p).forEach(m=>out.push(m)); // LQQOPERA 置最前，一律匯出
  const pom=postopModel(p); if(pom) out.push(pom); // 外科術後照護一律匯出
  const chm=chemoModel(p); if(chm) out.push(chm); // 化療／標靶副作用一律匯出

  if(focusIds.length){
    const fitems=focusIds.map(id=>ITEM_INDEX[id]&&ITEM_INDEX[id].item).filter(Boolean).filter(it=>itemVisible(it,p));
    const fRos=fitems.filter(it=>it.kind==="ROS");
    const fPe =fitems.filter(it=>it.kind==="PE");
    if(fRos.length||bn.focus_ros) out.push({title:"★ Focus ROS（重點問診）", note:bn.focus_ros||"", lines:fRos.map(itemLine)});
    if(fPe.length||bn.focus_pe)   out.push({title:"★ Focus PE（重點理學檢查）", note:bn.focus_pe||"", lines:fPe.map(itemLine)});
  }
  out.push(adlModel(p)); // ADL 一律匯出（含限縮版）
  SECTIONS.forEach(sec=>{
    if(!sectionVisible(sec,p)) return;
    let items=sec.items.filter(it=>!focusSet.has(it.id));
    const always=alwaysKeys.has(sec.key);
    if(limited && !always) items=items.filter(it=>hasFinding(p,it));
    const note=bn[sec.key]||"";
    if(items.length===0 && !note) return;
    const f=flipLabel(sec.label);
    out.push({title:`${f.en}${f.zh?"（"+f.zh+"）":""} · ${sec.kind}`, note, lines:items.map(itemLine)});
  });
  return out;
}

function exportHeader(){
  const p=CUR;
  const spec=SPEC_INDEX[p.specialty]||SPEC_INDEX.general;
  const demo=[];
  if(p.sex) demo.push(p.sex);
  if(p.age) demo.push(p.age+(/^\d+$/.test(String(p.age))?" 歲":""));
  return {code:p.code, spec:spec.label, time:fmtTime(Date.now()),
    demo:demo.join(" · "), problem:(p.problem||"").trim()};
}

/* ----- TXT ----- */
function buildText(limited){
  const h=exportHeader();
  const L=[];
  L.push("查房紀錄 ROS / PE Rounding Note");
  L.push(`病人代號：${h.code}`);
  if(h.demo) L.push(`基本資料：${h.demo}`);
  if(h.problem) L.push(`主要問題：${h.problem}`);
  L.push(`科別：${h.spec}`);
  L.push(`匯出時間：${h.time}`);
  L.push(limited?"（限縮版：重點＋陽性/異常＋備註）":"（完整版：全部項目）");
  L.push("".padEnd(40,"="));
  buildModel(limited).forEach(sec=>{
    L.push("");
    L.push(`【${sec.title}】`);
    if(sec.note) L.push(`  § 區塊備註：${sec.note}`);
    sec.lines.forEach(ln=>{
      L.push(`  ${ln.pos?"●":"○"} ${ln.label}：${ln.val}${ln.note}`);
    });
  });
  const gn=(CUR.globalNote||"").trim();
  L.push("");
  L.push("【其他備註 Additional notes】");
  L.push(gn?("  "+gn.split("\n").join("\n  ")):"  （無）");

  const todos=sortedTodos();
  L.push("");
  L.push("【待辦事項 To-do】");
  if(todos.length===0){ L.push("  （無）"); }
  else todos.forEach(t=>{
    const mark = t.status==="done"?"[✓完成]":"[待辦]";
    const imp = t.important?"★":"　";
    L.push(`  ${imp}${mark} ${t.text||"（未填）"}  (${fmtShort(t.createdAt)})`);
  });
  L.push("");
  L.push("".padEnd(40,"="));
  L.push("※ 本紀錄為臨床輔助草稿，請自行核對後再正式記載。");
  return L.join("\n");
}

function downloadText(filename,text){
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ----- PDF（列印） ----- */
function buildPrintHtml(limited){
  const h=exportHeader();
  let html=`<div class="pr-h">
      <h1>查房紀錄 ROS / PE</h1>
      <div class="pr-meta">病人代號：<b>${escapeHtml(h.code)}</b>${h.demo?`　｜　${escapeHtml(h.demo)}`:""}　｜　科別：${escapeHtml(h.spec)}　｜　${h.time}<br>
      ${h.problem?`主要問題：${escapeHtml(h.problem)}<br>`:""}${limited?"限縮版（重點＋陽性/異常＋備註）":"完整版（全部項目）"}</div>
    </div>`;
  buildModel(limited).forEach(sec=>{
    html+=`<div class="pr-sec"><h2>${escapeHtml(sec.title)}</h2>`;
    if(sec.note) html+=`<div class="pr-line" style="color:#0a5460"><b>§ 區塊備註：</b>${escapeHtml(sec.note)}</div>`;
    sec.lines.forEach(ln=>{
      html+=`<div class="pr-line ${ln.pos?"pos":""}">${ln.pos?"● ":"○ "}<span class="k">${escapeHtml(ln.label)}</span>：${escapeHtml(ln.val)}${ln.note?` <i>${escapeHtml(ln.note)}</i>`:""}</div>`;
    });
    html+=`</div>`;
  });
  const gn=(CUR.globalNote||"").trim();
  html+=`<div class="pr-sec"><h2>其他備註 Additional notes</h2><div class="pr-note">${gn?escapeHtml(gn):"（無）"}</div></div>`;
  const todos=sortedTodos();
  html+=`<div class="pr-sec"><h2>待辦事項 To-do</h2>`;
  if(todos.length===0){ html+=`<div class="pr-line">（無）</div>`; }
  else todos.forEach(t=>{
    const mark=t.status==="done"?"✓ 完成":"待辦";
    html+=`<div class="pr-line ${t.status!=="done"?"pos":""}">${t.important?"★ ":""}[${mark}] ${escapeHtml(t.text||"（未填）")} <i>(${fmtShort(t.createdAt)})</i></div>`;
  });
  html+=`</div>`;
  html+=`<div style="margin-top:14px;font-size:11px;color:#666">※ 本紀錄為臨床輔助草稿，請自行核對後再正式記載。列印對話框請選擇「另存為 PDF」。</div>`;
  return html;
}

/* 完整可列印 HTML 文件（新視窗用，自帶樣式，避免 iframe 列印外層空白頁） */
function printDocument(limited){
  return `<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>查房紀錄</title>
<style>
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#111;margin:22px;line-height:1.5}
.pr-h{border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}
.pr-h h1{font-size:19px;margin:0 0 4px}.pr-meta{font-size:12.5px;color:#333}
.pr-sec{margin:0 0 12px}.pr-sec h2{font-size:14px;margin:0 0 4px;padding:3px 0;border-bottom:1px solid #999}
.pr-line{font-size:12.5px;padding:2px 0;line-height:1.5}.pr-line .k{font-weight:700}.pr-line i{color:#b45309;font-style:normal}
.pr-note{white-space:pre-wrap;font-size:12.5px;border:1px solid #999;padding:8px;border-radius:6px}
.noprint{margin:18px 0;text-align:center}
.noprint button{font-size:15px;padding:11px 22px;border-radius:9px;border:1px solid #0e6b7a;background:#0e6b7a;color:#fff;font-weight:700}
@media print{@page{margin:14mm}.noprint{display:none}}
</style></head><body>
${buildPrintHtml(limited)}
<div class="noprint"><button onclick="window.print()">列印 / 存成 PDF</button></div>
</body></html>`;
}

/* 穩健列印：優先開新視窗（自帶內容），失敗才退回頁內列印 */
function robustPrint(limited){
  let w=null;
  try{ w=window.open("","_blank"); }catch(e){ w=null; }
  if(w && w.document){
    try{
      w.document.open(); w.document.write(printDocument(limited)); w.document.close();
      const go=()=>{ try{ w.focus(); w.print(); }catch(e){} };
      if(w.document.readyState==="complete") setTimeout(go,300);
      else w.onload=()=>setTimeout(go,250);
      return;
    }catch(e){ try{ w.close(); }catch(_){} }
  }
  const pa=$("#printArea");
  pa.innerHTML=buildPrintHtml(limited);
  const done=()=>{ pa.innerHTML=""; window.removeEventListener("afterprint",done); };
  window.addEventListener("afterprint",done);
  setTimeout(()=>{ try{ window.print(); }catch(e){} },80);
}

/* 複製全文（clipboard API，退回 execCommand） */
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallbackCopy(text));
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  try{
    const ta=document.createElement("textarea"); ta.value=text;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.focus(); ta.select(); const ok=document.execCommand("copy"); ta.remove(); return ok;
  }catch(e){ return false; }
}

/* 匯出 → 開啟預覽 modal（先看到內容，證明不空白；並提供複製作為保底） */
function doExport(kind){
  const limited = kind.indexOf("lim")===0;
  const isPdf   = kind.indexOf("pdf")>=0;
  openExportModal(limited,isPdf);
}
function mkBtn(label,cls,fn){ const b=document.createElement("button"); b.className="btn "+cls; b.textContent=label; b.onclick=fn; return b; }
function closeExportModal(){ $("#exportModal").classList.remove("show"); }

function openExportModal(limited,isPdf){
  const h=exportHeader();
  const stamp=(h.code||"note").replace(/[^\w\u4e00-\u9fa5-]/g,"_");
  const text=buildText(limited);
  const modal=$("#exportModal");
  $("#modalTitle").textContent = `${isPdf?"PDF":"TXT"} 預覽 · ${limited?"限縮版":"完整版"}`;
  const scroll=$("#modalScroll");
  if(isPdf){
    scroll.innerHTML=`<div class="docprev">${buildPrintHtml(limited)}</div>`;
  }else{
    scroll.innerHTML="";
    const pre=document.createElement("div"); pre.className="txtprev"; pre.textContent=text;
    scroll.appendChild(pre);
  }
  const foot=$("#modalFoot"); foot.innerHTML="";
  const btnCopy=mkBtn("📋 複製全文","",()=>{ copyText(text).then(ok=>toast(ok?"已複製到剪貼簿":"複製失敗，請長按選取")); });
  if(isPdf){
    foot.appendChild(mkBtn("🖨 列印 / 存成 PDF","primary",()=>robustPrint(limited)));
    foot.appendChild(btnCopy);
  }else{
    foot.appendChild(mkBtn("⬇ 下載 .txt","primary",()=>{ downloadText(`ROS_PE_${stamp}_${limited?"限縮":"完整"}.txt`, text); toast("已下載 .txt"); }));
    foot.appendChild(btnCopy);
  }
  modal.classList.add("show");
}

/* ---------- utils ---------- */
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* 複選下拉只在使用者主動操作時收合：可點 summary 或「完成／收合」 */
document.addEventListener("click",e=>{
  const close=e.target.closest&&e.target.closest("[data-multi-close]");
  if(close){
    e.preventDefault();e.stopPropagation();
    const box=close.closest("details.multi-select");
    if(box){box.open=false;const sum=box.querySelector("summary");if(sum)sum.focus();}
    return;
  }
});

/* 關閉匯出選單（點外部） */
document.addEventListener("click",e=>{
  const m=$("#exportMenu");
  if(m&&m.classList.contains("show") && !e.target.closest("#exportMenu") && !e.target.closest("#exportBtn")) closeMenu();
});

/* ---------- 自動長高（field-sizing 後備） ---------- */
function autoGrow(el){ if(!el||el.tagName!=="TEXTAREA")return; el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; }
function resizeAutogrow(root){ (root||document).querySelectorAll("textarea.autogrow").forEach(el=>{ if(el.offsetParent!==null) autoGrow(el); }); }
document.addEventListener("input",e=>{ const t=e.target; if(t&&t.classList&&t.classList.contains("autogrow")) autoGrow(t); });

/* ---------- 匯出 modal 關閉 ---------- */
(function(){
  const mc=$("#modalClose"), mm=$("#exportModal");
  if(mc) mc.onclick=closeExportModal;
  if(mm) mm.addEventListener("click",e=>{ if(e.target.id==="exportModal") closeExportModal(); });
})();

/* ---------- 啟動：先載入資料再渲染 ---------- */
(async function boot(){
  try{ DB = (await Store.read()) || {patients:[]}; }
  catch(e){ DB = {patients:[]}; }
  if(!DB.patients) DB.patients=[];
  renderList();
})();
</script>
