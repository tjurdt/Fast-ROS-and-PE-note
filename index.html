const DNR_OPTIONS=[
  "不施行心肺復甦術",
  "不氣管內插管／人工呼吸",
  "不胸外按壓",
  "不電擊去顫／人工節律",
  "不急救藥物注射",
  "不施行維生醫療",
  "接受安寧緩和醫療",
  "預立意願書／預立醫療決定已註記"
];
const DNR_CLINICAL_PATTERNS=[/不施行心肺復甦|\bDNR\b/i,/不氣管內插管|\bDNI\b/i,/不胸外按壓/,/不電擊/,/不急救藥物/,/不施行維生醫療/];
function normalizeDnrOptionLabel(v){
  const s=(v||"").toString();
  if(/不施行心肺復甦|\bDNR\b/i.test(s))return DNR_OPTIONS[0];
  if(/不氣管內插管|\bDNI\b/i.test(s))return DNR_OPTIONS[1];
  if(/不胸外按壓/.test(s))return DNR_OPTIONS[2];
  if(/不電擊/.test(s))return DNR_OPTIONS[3];
  if(/不急救藥物/.test(s))return DNR_OPTIONS[4];
  if(/不施行維生醫療/.test(s))return DNR_OPTIONS[5];
  if(/安寧緩和/.test(s))return DNR_OPTIONS[6];
  if(/預立意願書|預立醫療決定/.test(s))return DNR_OPTIONS[7];
  return s;
}
function legacyDnrSelections(v){
  if(Array.isArray(v))return v.map(normalizeDnrOptionLabel).filter(x=>DNR_OPTIONS.includes(x));
  if(typeof v!=="string"||!v.trim())return [];
  if(v==="DNR / DNI")return [DNR_OPTIONS[0],DNR_OPTIONS[1]];
  if(v==="DNR")return [DNR_OPTIONS[0]];
  if(v==="DNI")return [DNR_OPTIONS[1]];
  return [];
}
function dnrStateMap(v, masterOn){
  if(v&&typeof v==="object"&&!Array.isArray(v)){
    const out={}; DNR_OPTIONS.forEach(k=>{ const x=v[k]; out[k]=(x==="agree"||x==="disagree")?x:""; }); return out;
  }
  const selected=legacyDnrSelections(v),out={};
  DNR_OPTIONS.forEach(k=>{ out[k]=selected.includes(k)?"agree":(masterOn?"":""); });
  return out;
}
function ensureDnrStates(data, defaultAll){
  const raw=data.f_sys_orders_1;
  const map=dnrStateMap(raw, data.f_sys_orders_0===true);
  const hasExisting = Array.isArray(raw) ? raw.length>0 : !!(raw&&typeof raw==="object"&&Object.values(raw).some(v=>v==="agree"||v==="disagree"));
  if(defaultAll&&!hasExisting) DNR_OPTIONS.forEach(k=>{ map[k]="agree"; });
  data.f_sys_orders_1=map; return map;
}
function patientDnrSelections(p){
  const d=p&&p.customSets&&p.customSets.sys_orders; if(!d)return [];
  const map=dnrStateMap(d.f_sys_orders_1,d.f_sys_orders_0===true);
  return DNR_OPTIONS.filter(k=>map[k]==="agree");
}
function patientHasDNR(p){
  const d=p&&p.customSets&&p.customSets.sys_orders; if(!d)return false;
  if(typeof d.f_sys_orders_0==="boolean")return d.f_sys_orders_0;
  return patientDnrSelections(p).some(x=>DNR_CLINICAL_PATTERNS.some(rx=>rx.test(x)));
}
function migratePatientData(p){
  if(!p||typeof p!=="object")return false; let changed=false;
  if(!p.values)p.values={}; if(!p.blockNotes)p.blockNotes={}; if(!Array.isArray(p.todos))p.todos=[];
  if(p.customSets&&p.customSets.sys_orders){
    const d=p.customSets.sys_orders,v=d.f_sys_orders_0;
    if(Array.isArray(v)||typeof v==="string"){
      const oldSel=legacyDnrSelections(v);
      d.f_sys_orders_1=dnrStateMap(oldSel,oldSel.length>0);
      d.f_sys_orders_0=oldSel.some(x=>DNR_CLINICAL_PATTERNS.some(rx=>rx.test(x)));
      if(d.__notes&&d.__notes.f_sys_orders_0&&!d.__notes.f_sys_orders_1){
        d.__notes.f_sys_orders_1=d.__notes.f_sys_orders_0;
        delete d.__notes.f_sys_orders_0;
      }
      changed=true;
    }
    if(d.f_sys_orders_0===true){
      const before=JSON.stringify(d.f_sys_orders_1||null);
      ensureDnrStates(d,true);
      if(JSON.stringify(d.f_sys_orders_1)!==before)changed=true;
    }
  }
  const old=p.customSets&&p.customSets.sys_infection;
  if(old){
    if(!Array.isArray(p.infections)||!p.infections.length){
      const inf=newInfectionRecord();
      const q=Array.isArray(old.f_sys_infection_0)?old.f_sys_infection_0:[];
      inf.qsofa.sbp=q.includes("SBP≤100")?"yes":"";
      inf.qsofa.rr=q.includes("RR≥22")?"yes":"";
      inf.qsofa.mentation=q.includes("意識改變 AMS")?"yes":"";
      inf.sources=Array.isArray(old.f_sys_infection_1)?old.f_sys_infection_1:[];
      inf.cultures=Array.isArray(old.f_sys_infection_2)?old.f_sys_infection_2:[];
      const drug=(old.f_sys_infection_4||"").toString().trim(),start=(old.f_sys_infection_5||"").toString();
      if(drug||start)inf.antibiotics.push({id:csUid("abx"),drug,startDate:start,route:"",note:""});
      p.infections=[inf];
    }
    delete p.customSets.sys_infection; changed=true;
  }
  if(!Array.isArray(p.infections))p.infections=[];
  return changed;
}

        <button class="tb tb-todo ${t.status==="todo"?"sel":""}" data-st="todo" title="待辦">待</button>
        <button class="tb tb-done ${t.status==="done"?"sel":""}" data-st="done" title="完成">完</button>
        <button class="tb tb-del" data-st="del" title="刪除">✕</button>
      </div>
      <span class="todo-time">${fmtShort(t.createdAt)}</span>`;
    row.querySelector(".todo-star").onclick=()=>{ t.important=!t.important; touch(); renderTodos(); };
    const txt=row.querySelector(".todo-text");
    txt.addEventListener("input",()=>{ t.text=txt.value; touch(); }); // 即時儲存、不重繪以保留游標
    row.querySelectorAll("[data-st]").forEach(b=>{
      b.onclick=()=>{
        const st=b.getAttribute("data-st");
        if(st==="del"){ CUR.todos=CUR.todos.filter(x=>x.id!==t.id); touch(); renderTodos(); return; }
        t.status=st; touch(); renderTodos();
      };
    });
    list.appendChild(row);
    if(focusId && t.id===focusId) txt.focus();
  });
  resizeAutogrow(list);
}

function flipLabel(s){
  const m=String(s).match(/^(.+?)\s+([A-Za-z].*)$/);

  return {en:s, zh:""};
}

function scoreCycleHtml(kind,key,val){

}
function cycleScoreValue(obj,key){const cur=obj[key]||"",i=SCORE_STATES.indexOf(cur);obj[key]=SCORE_STATES[(i+1)%SCORE_STATES.length];}
function scoreInfo(obj,criteria){
  const vals=criteria.map(c=>obj[c.k]||""),score=vals.filter(v=>v==="yes").length,done=vals.filter(Boolean).length;

function qsofaAdvice(q){

  return {cls:"",text:`qSOFA ${x.score}/3：未達 ≥2 高風險門檻；仍須結合臨床、器官功能與其他警示評估。`};

   自訂組套（使用者可自建的組套範本 + 病人層級的填寫實例）

function csUid(pfx){ return (pfx||"cs")+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function customSetTemplates(){ return Array.isArray(DB.customSets)?DB.customSets:(DB.customSets=[]); }

/* 內建預設組套（用相同的欄位引擎；不可從編輯器刪除，但可每位病人加/移除）。
   f() 產生欄位；洗腎組套帶 auto 觸發（PMH 含 ESRD 關鍵字時自動帶入）。 */
function csField(type,label,options){ return {type, label, options:options||[]}; }
const BUILTIN_SETS=[
  {id:"sys_dialysis", name:"洗腎 Dialysis", builtin:true,
   auto:{pmh:["ESRD","末期腎","洗腎","透析","dialysis","end-stage renal","end stage renal"]},
   fields:[
     csField("select","透析方式",["血液透析 HD","腹膜透析 PD"]),
     csField("days","每週透析日"),
     csField("select","血管通路",["AVF","AVG","暫時導管 Temp cath","長期導管 Permcath","腹透導管 PD cath"]),
     csField("text","乾體重 kg"),
     csField("date","最後透析日"),
     csField("select","尿量",["有餘尿 Residual","無尿 Anuric"]),
   ]},
  {id:"sys_orders", name:"DNR", builtin:true,

     csField("dnrstates","DNR 項目",DNR_OPTIONS)

function allTemplates(){ return BUILTIN_SETS.concat(customSetTemplates()); }
BUILTIN_SETS.forEach(t=>t.fields.forEach((f,i)=>{ f.id="f_"+t.id+"_"+i; })); // 穩定、跨載入不變的欄位 id
function findTemplate(id){ return allTemplates().find(t=>t.id===id); }
function csDef(field){ return {dropdown:true, normal:null, options:(field.options||[]).map(v=>({v}))}; }

function ensureCustomInstance(setId){
  if(!CUR.customSets) CUR.customSets={};
  if(!CUR.customSets[setId]) CUR.customSets[setId]={};
  return CUR.customSets[setId];
}
function addCustomSet(setId){
  ensureCustomInstance(setId);
  touch(); renderBundleLauncher(); renderCustomSets(setId);
}
function removeCustomSet(setId){
  if(CUR.customSets) delete CUR.customSets[setId];
  touch(); renderBundleLauncher(); renderCustomSets();
}
function activeCustomSetIds(){
  const inst=CUR.customSets||{};
  return allTemplates().filter(t=>inst[t.id]).map(t=>t.id);
}
/* 依過去病史自動帶入組套（目前：PMH 含 ESRD/透析關鍵字 → 洗腎組套）。
   每位病人每個組套只自動帶入一次；之後手動移除不會再被塞回。 */
function maybeAutoBundles(){
  if(!CUR) return;
  const pmhText=(CUR.pmh||[]).map(x=>(x.text||"")).join(" ").toLowerCase();
  if(!pmhText.trim()) return;
  if(!CUR.autoTriggered) CUR.autoTriggered={};
  let added=null;
  BUILTIN_SETS.forEach(t=>{
    if(!t.auto||!Array.isArray(t.auto.pmh)) return;
    if(CUR.customSets&&CUR.customSets[t.id]) return;
    if(CUR.autoTriggered[t.id]) return;
    if(t.auto.pmh.some(k=>pmhText.includes(String(k).toLowerCase()))){
      ensureCustomInstance(t.id);
      CUR.autoTriggered[t.id]=true;
      added=t.name;
    }
  });
  if(added){ touch(); renderBundleLauncher(); renderCustomSets(); toast("已依病史自動帶入「"+added+"」組套"); }
}
function renderCustomSets(focusNewId){
  const area=$("#customArea"); if(!area||!CUR) return;
  area.innerHTML="";
  activeCustomSetIds().forEach(id=>{
    const tpl=findTemplate(id); if(!tpl) return;
    area.appendChild(buildCustomSetCard(tpl, ensureCustomInstance(id), focusNewId===id));
  });
  resizeAutogrow(area);
}
function csControlHtml(field, data, tpl){
  const val=data[field.id];
  if(field.type==="toggle"){
    const on=val===true;
    if(tpl&&tpl.id==="sys_orders"){
      return `<button type="button" class="dnr-state-btn ${on?"on":""}" data-cs-toggle="${field.id}">${on?"有 DNR":"無 DNR"}</button>`;
    }
    return `<button type="button" class="toggle ${on?"on":""}" data-cs-toggle="${field.id}">${on?"(+) 是":"(−) 否"}</button>`;
  }
  if(field.type==="text"){
    return `<textarea rows="1" class="autogrow" data-cs-text="${field.id}" placeholder="輸入">${escapeHtml(val||"")}</textarea>`;
  }
  if(field.type==="date"){
    if(tpl&&tpl.id==="sys_dialysis"){
      const dd=calcElapsedDay(val||"");
      return `<div class="cs-date-wrap"><input type="date" data-cs-date="${field.id}" value="${escapeHtml(val||"")}"><span class="cs-daybadge ${dd.cls}" data-cs-date-badge="${field.id}">${escapeHtml(dd.text)}</span></div>`;
    }
    return `<input type="date" data-cs-date="${field.id}" value="${escapeHtml(val||"")}">`;
  }
  if(field.type==="select"){
    const opts=[`<option value="">— 選擇 —</option>`].concat((field.options||[]).map(o=>`<option value="${escapeHtml(o)}" ${o===(val||"")?"selected":""}>${escapeHtml(o)}</option>`)).join("");
    return `<select data-cs-select="${field.id}">${opts}</select>`;
  }
  if(field.type==="multi"){
    return multiHtml(data, field.id, csDef(field), "cset");
  }
  if(field.type==="days"){
    const arr=Array.isArray(val)?val:[];
    return `<div class="dz-days">${DIALYSIS_DAYS.map(d=>`<button type="button" class="dz-day ${arr.includes(d.k)?"on":""}" data-cs-day="${field.id}" data-cs-dayk="${d.k}">${d.k}<small>${d.d}</small></button>`).join("")}</div>`;
  }
  if(field.type==="dnrstates"){
    const states=dnrStateMap(data.f_sys_orders_1,data.f_sys_orders_0===true);
    return `<div class="dnr-state-list">${DNR_OPTIONS.map(o=>{const st=states[o]||"",txt=st==="agree"?"同意":(st==="disagree"?"未同意":"—");return `<div class="dnr-state-row"><span class="dnr-state-label">${escapeHtml(o)}</span><button type="button" class="dnr-cycle ${st}" data-dnr-cycle="${field.id}" data-dnr-key="${escapeHtml(o)}">${txt}</button></div>`;}).join("")}</div>`;
  }
  if(field.type==="chips"){
    const arr=Array.isArray(val)?val:[];
    return `<div class="cs-chips">${(field.options||[]).map(o=>`<button type="button" class="cs-chip ${arr.includes(o)?"on":""}" data-cs-chip="${field.id}" data-cs-chipv="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join("")}</div>`;
  }
  return "";
}
// 非文字欄位才顯示備註（✎）按鈕；文字欄位本身即可書寫
function csFieldHasNote(field){ return field.type!=="text"&&field.type!=="dnrstates"; }
function buildCustomSetCard(tpl, data, focusNew){
  const card=document.createElement("div");
  card.className="cset-card"+(tpl.id==="sys_orders"?" dnr-card":"")+(focusNew?"":" collapsed");
  if(!data.__notes) data.__notes={};
  const fieldHtml=(f,idx)=>{
    const isDnrState=tpl.id==="sys_orders"&&idx===0;
    const isDnrDetail=tpl.id==="sys_orders"&&idx===1;
    const allowNote=csFieldHasNote(f)&&!isDnrState;
    const noteBtn = allowNote
      ? `<button type="button" class="po-note-btn ${(data.__notes[f.id]||"").trim()?"active":""}" data-cs-noteb="${f.id}" title="備註">✎</button>` : "";
    const noteRow = allowNote
      ? `<div class="cset-note ${(data.__notes[f.id]||"").trim()?"show":""}" data-cs-notewrap="${f.id}"><textarea rows="1" class="autogrow" data-cs-note="${f.id}" placeholder="備註…">${escapeHtml(data.__notes[f.id]||"")}</textarea></div>` : "";
    const dnrClass=isDnrDetail?` dnr-detail${data.f_sys_orders_0===true?" show":""}`:"";
    return `<div class="cset-field${dnrClass}"><div class="cset-field-top">${isDnrDetail?"":`<span class="cset-k">${escapeHtml(f.label||"（未命名欄位）")}</span>`}<div class="cset-control">${csControlHtml(f,data,tpl)}</div>${noteBtn}</div>${noteRow}</div>`;
  };
  const fieldsHtml = (tpl.fields||[]).length
    ? tpl.fields.map(fieldHtml).join("")
    : `<div class="cset-empty">此組套尚無欄位；可到「組套編輯器」新增。</div>`;
  card.innerHTML=`
    <div class="cset-bhead">
      <span class="cset-btitle">${escapeHtml(tpl.name||"自訂組套")}</span>
      <button class="cset-del" data-cs-del>刪除組套</button>
      <span class="chev" data-cs-chev>▾</span>
    </div>
    <div class="cset-body">${tpl.id==="sys_orders"?`<div class="dnr-hint">請依病人正式意願書、同意書、健保卡註記與醫囑核對；此處為查房提示。</div>`:""}${fieldsHtml}${(tpl.id==="sys_orders"||tpl.id==="sys_dialysis")?`<div class="cset-setnote"><label>組套註記</label><textarea rows="1" class="autogrow" data-cs-setnote placeholder="整個組套的註記…">${escapeHtml(data.__setNote||"")}</textarea></div>`:""}</div>`;
  wireBundleHeader(card,".cset-bhead","collapsed");
  card.querySelector("[data-cs-del]").onclick=()=>removeCustomSet(tpl.id);
  // toggle
  card.querySelectorAll("[data-cs-toggle]").forEach(btn=>btn.onclick=()=>{
    const k=btn.getAttribute("data-cs-toggle"); data[k]=!(data[k]===true);
    if(tpl.id==="sys_orders"){
      if(data[k]===true) ensureDnrStates(data,true);
      touch(); renderCustomSets(tpl.id); return;
    }
    btn.classList.toggle("on",data[k]); btn.textContent=data[k]?"(+) 是":"(−) 否"; touch();
  });
  // text
  card.querySelectorAll("[data-cs-text]").forEach(inp=>inp.addEventListener("input",()=>{ data[inp.getAttribute("data-cs-text")]=inp.value; touch(); }));
  // date
  card.querySelectorAll("[data-cs-date]").forEach(inp=>inp.addEventListener("change",()=>{
    const key=inp.getAttribute("data-cs-date"); data[key]=inp.value;
    const badge=card.querySelector(`[data-cs-date-badge="${key}"]`);
    if(badge){const dd=calcElapsedDay(inp.value);badge.textContent=dd.text;badge.className=`cs-daybadge ${dd.cls}`.trim();}
    touch();
  }));
  // select
  card.querySelectorAll("[data-cs-select]").forEach(sel=>sel.addEventListener("change",()=>{ data[sel.getAttribute("data-cs-select")]=sel.value; touch(); }));
  // multi
  card.querySelectorAll("[data-cset-multi]").forEach(btn=>btn.onclick=e=>{
    e.preventDefault(); e.stopPropagation();
    const box=btn.closest("details.multi-select");
    const key=btn.getAttribute("data-cset-multi");
    const field=(tpl.fields||[]).find(f=>f.id===key);
    toggleMulti(data,key,btn.getAttribute("data-cset-value"),null);
    touch(); if(field) syncMultiControl(card,data,key,csDef(field),"cset"); if(box)box.open=true;
  });
  // days (W1–W7)
  card.querySelectorAll("[data-cs-day]").forEach(btn=>btn.onclick=()=>{

    if(!Array.isArray(data[key])) data[key]=[];
    const i=data[key].indexOf(k);
    if(i>=0) data[key].splice(i,1); else data[key].push(k);
    data[key].sort((a,c)=>DIALYSIS_DAYS.findIndex(x=>x.k===a)-DIALYSIS_DAYS.findIndex(x=>x.k===c));
    btn.classList.toggle("on",data[key].includes(k)); touch();

  card.querySelectorAll("[data-dnr-cycle]").forEach(btn=>btn.onclick=()=>{

  });
  // chips（單列複選）
  card.querySelectorAll("[data-cs-chip]").forEach(btn=>btn.onclick=()=>{
    const key=btn.getAttribute("data-cs-chip"), v=btn.getAttribute("data-cs-chipv");
    if(!Array.isArray(data[key])) data[key]=[];
    const i=data[key].indexOf(v);
    if(i>=0) data[key].splice(i,1); else data[key].push(v);
    btn.classList.toggle("on",data[key].includes(v)); touch();
  });
  // 備註（✎）：切換顯示；輸入即存
  card.querySelectorAll("[data-cs-noteb]").forEach(btn=>btn.onclick=()=>{
    const key=btn.getAttribute("data-cs-noteb");
    const wrap=card.querySelector(`[data-cs-notewrap="${key}"]`);
    const show=!wrap.classList.contains("show");
    wrap.classList.toggle("show",show);
    if(show){ const ta=wrap.querySelector("textarea"); resizeAutogrow(wrap); ta.focus(); }
  });
  card.querySelectorAll("[data-cs-note]").forEach(ta=>ta.addEventListener("input",()=>{
    const key=ta.getAttribute("data-cs-note"); data.__notes[key]=ta.value;
    const btn=card.querySelector(`[data-cs-noteb="${key}"]`);
    if(btn) btn.classList.toggle("active",!!ta.value.trim());
    touch();
  }));
  const setNote=card.querySelector("[data-cs-setnote]");
  if(setNote) setNote.addEventListener("input",()=>{ data.__setNote=setNote.value; touch(); });
  resizeAutogrow(card);
  return card;
}
function customSetsModel(p){
  const inst=p.customSets||{}; const out=[];
  allTemplates().forEach(tpl=>{
    if(!inst[tpl.id]) return;
    const data=inst[tpl.id]||{}; const notes=data.__notes||{};
    const lines=(tpl.fields||[]).map(f=>{
      let val="", pos=false;
      if(f.type==="toggle"){ pos=data[f.id]===true; val=(tpl.id==="sys_orders"?(pos?"有 DNR":"無 DNR"):(pos?"(+) 是":"(−) 否")); }
      else if(f.type==="dnrstates"){ const m=dnrStateMap(data[f.id],data.f_sys_orders_0===true); val=DNR_OPTIONS.map(k=>`${k}：${m[k]==="agree"?"同意":(m[k]==="disagree"?"未同意":"—")}`).join("；"); pos=Object.values(m).some(x=>x==="agree"||x==="disagree"); }
      else if(f.type==="multi"||f.type==="days"||f.type==="chips"){ const a=Array.isArray(data[f.id])?data[f.id]:[]; val=a.length?a.join("、"):"—"; pos=a.length>0; }
      else if(f.type==="select"){ val=data[f.id]||"未選擇"; pos=!!data[f.id]; }
      else { const s=(data[f.id]||"").toString().trim(); val=s||"—"; pos=!!s;
        if(f.type==="date"&&tpl.id==="sys_dialysis"&&s){const dd=calcElapsedDay(s);val=[s,dd.value].filter(Boolean).join(" · ");}
      }
      const nt=(notes[f.id]||"").trim();
      return {label:f.label||"（欄位）", val, pos:pos||!!nt, note:nt};
    });
    out.push({title:`組套 · ${tpl.name||"自訂組套"}`, note:(data.__setNote||"").trim(), lines});
  });
  return out;
}

function wireSection(sec, blockKey, hasNote){
  const head=sec.querySelector(".sec-head");
  const noteBtn=sec.querySelector("[data-secnote]");
  const wrap=sec.querySelector(".blocknote-wrap");
  const input=wrap.querySelector(".blocknote-input");
  if(hasNote) noteBtn.classList.add("active");
  head.addEventListener("click",e=>{
    if(e.target.closest("[data-secnote]")) return;
    sec.classList.toggle("collapsed");
    if(!sec.classList.contains("collapsed")) resizeAutogrow(sec);
  });
  noteBtn.addEventListener("click",e=>{
    e.stopPropagation();
    sec.classList.remove("collapsed");
    const show=wrap.classList.toggle("show");
    noteBtn.classList.toggle("active", show || !!input.value);
    if(show){ input.focus(); autoGrow(input); }
  });
  input.addEventListener("input",()=>{
    if(!CUR.blockNotes) CUR.blockNotes={};
    CUR.blockNotes[blockKey]=input.value;
    noteBtn.classList.toggle("active", wrap.classList.contains("show") || !!input.value);
    touch();
  });
}

/* ---------- 單一項目 render ---------- */
function renderItem(it){
  const p=CUR, v=vOf(p,it.id);
  const el=document.createElement("div");
  el.className="item"; el.dataset.item=it.id;

  const enText = it.en || it.label;        // 英文為主（無 en 時 label 本身即英文/術語）
  const zhText = it.en ? it.label : "";    // 有 en 時 label 為中文副標
  const labelHtml=`<div class="item-label"><span class="lab-en">${escapeHtml(enText)}${it.star?'<span class="star">★</span>':""}</span>${zhText?`<span class="lab-zh">${escapeHtml(zhText)}</span>`:""}</div>`;

  let control="";
  if(it.type==="toggle"){
    control=`<button class="toggle ${v.on?"on":""}" data-toggle>${v.on?"(+) 陽性":"(−) 陰性"}</button>`;
  }else if(it.type==="select"){
    control=selectHtml(it,v.sel);
  }else if(it.type==="group"){
    control=""; // 群組另起一行
  }else if(it.type==="custom"){
    control=""; // 自訂 widget 另起一行
  }else if(it.type==="text"){
    control=`<textarea class="isel autogrow" style="max-width:56%" rows="1" data-textfield placeholder="輸入">${escapeHtml(v.text||"")}</textarea>`;
  }

  if(it.type==="group"||it.type==="custom") el.classList.add("has-group");

  el.innerHTML=`<div class="item-row">
      ${labelHtml}
      ${control}
      <button class="notebtn ${v.note?"active":""}" data-notebtn title="備註">✎</button>
    </div>`;

  // group / custom 內容：獨立整行
  if(it.type==="group"){
    el.appendChild(buildGroup(it,v));
  }else if(it.type==="custom"){
    el.appendChild(buildCustom(it,v));
  }

  // follow-up 容器（toggle 陽性、或 select 選到觸發值時展開）
  if((it.type==="toggle"||it.type==="select") && it.fu){
    const sub=buildFollowUps(it,v);
    el.appendChild(sub);
    const open = it.type==="toggle" ? !!v.on : (v.sel===it.fuOn);
    if(open) sub.classList.add("show");
  }

  // 顱神經詳細面板
  if(it.cnPanel){
    const panel=buildCNPanel(it,v);
    el.appendChild(panel);
    if(v.sel===it.cnOn) panel.classList.add("show");
  }

  // 備註欄
  const noteInput=document.createElement("textarea");
  noteInput.className="itemnote autogrow"+(v.note?" show":"");
  noteInput.rows=1;
  noteInput.setAttribute("data-noteinput","");
  noteInput.placeholder="敘述 / 備註";
  noteInput.value=v.note||"";
  el.appendChild(noteInput);

  wireItem(el,it);
  applyItemHitClass(el,it);
  return el;
}

function selectHtml(it,val){
  const cur=val||"";
  const abn = cur && cur!==it.normal;
  const cls = abn?"abn":(cur?"norm":"");
  return `<button class="icycle ${cls}" data-cycle>${escapeHtml(cur||"未評估")}</button>`;
}

function buildGroup(it,v){
  const g=v.grp||{};
  const wrapEl=document.createElement("div");
  wrapEl.className="grpwrap grpslider";
  it.fields.forEach(f=>{
    const nums=f.opts.map(Number);
    const mn=Math.min(...nums), mx=Math.max(...nums);
    const cur=(g[f.id]===undefined?"":g[f.id]);
    const abn=cur!=="" && cur!==f.normal;
    const thumb=(cur===""?f.normal:cur);
    const fld=document.createElement("div");
    fld.className="grow-field"+(abn?" abn":"");
    fld.innerHTML=`<span class="gf-lab">${f.label}</span>
      <input type="range" min="${mn}" max="${mx}" step="1" value="${thumb}" data-grp="${f.id}">
      <span class="gf-val">${cur===""?"—":cur}</span>
      <button class="gf-clear" data-grp-clear="${f.id}" title="清除並回到未評估">清除</button>`;
    wrapEl.appendChild(fld);
  });
  if(it.total){
    const tot=document.createElement("div");
    tot.className="grptotal"; tot.dataset.total="1";
    wrapEl.appendChild(tot);
  }
  return wrapEl;
}
function updateGroupTotal(el,it,v){
  const totEl=el.querySelector("[data-total]"); if(!totEl)return;
  const g=v.grp||{};
  let allSet=it.fields.every(f=>g[f.id]);
  if(!allSet){ totEl.textContent=""; totEl.classList.remove("abn"); return; }
  let sum=it.fields.reduce((a,f)=>a+parseInt(g[f.id],10),0);
  totEl.textContent=`= ${sum}`;
  totEl.classList.toggle("abn", sum<it.total);
}

function buildFollowUps(it,v){
  const sub=document.createElement("div");
  sub.className="subwrap";
  const fv=v.fu||{};
  it.fu.forEach(f=>{
    const row=document.createElement("div"); row.className="subrow";
    if(f.type==="select"){
      const cur=fv[f.id]||"";
      const opts=[`<option value="">— 選擇 —</option>`].concat(f.opts.map(o=>`<option value="${escapeHtml(o)}" ${o===cur?"selected":""}>${escapeHtml(o)}</option>`)).join("");
      row.innerHTML=`<span class="sublab">${escapeHtml(f.label)}</span><select class="subsel" data-fu="${f.id}">${opts}</select>`;
    }else if(f.type==="text"){
      row.innerHTML=`<span class="sublab">${escapeHtml(f.label)}</span><textarea class="subtext autogrow" rows="1" data-fu="${f.id}" placeholder="輸入">${escapeHtml(fv[f.id]||"")}</textarea>`;
    }else if(f.type==="toggle"){
      const on=fv[f.id]==="1";
      row.innerHTML=`<button class="toggle ${on?"on":""}" data-futoggle="${f.id}" style="min-width:auto;font-size:12.5px;padding:5px 12px">${escapeHtml(f.label)} ${on?"(+)":""}</button>`;
    }
    sub.appendChild(row);
  });
  return sub;
}

/* 顱神經詳細面板：分左右 → 左/右表格；不分邊 → chips；另有描述 */
function buildCNPanel(it,v){
  if(!v.cn) v.cn={};
  const panel=document.createElement("div");
  panel.className="cnpanel";
  it.cnPanel.forEach(n=>{
    const st=v.cn[n.id]||{}, grid=st.grid||{}, mono=st.mono||[], abn=!!st.abn;
    const gridHtml = (n.sides&&n.sides.length) ? `
      <div class="cn-grid">
        <div class="cng-head"><span></span><span>左 L</span><span>右 R</span></div>
        ${n.sides.map(s=>`<div class="cng-row">
          <span class="cng-lab">${escapeHtml(s.l)}</span>
          <button class="cng-cell ${grid[s.k+"_L"]?"on":""}" data-cell="${s.k}_L">${grid[s.k+"_L"]?"✓":""}</button>
          <button class="cng-cell ${grid[s.k+"_R"]?"on":""}" data-cell="${s.k}_R">${grid[s.k+"_R"]?"✓":""}</button>
        </div>`).join("")}
      </div>` : "";
    const monoHtml = (n.mono&&n.mono.length) ? `<div class="cn-chips">${n.mono.map(m=>`<button class="cn-chip ${mono.includes(m)?"on":""}" data-cm="${escapeHtml(m)}">${escapeHtml(m)}</button>`).join("")}</div>` : "";
    const row=document.createElement("div"); row.className="cn-row"+(abn?" abn":"");
    row.innerHTML=`
      <div class="cn-top">
        <button class="cn-tog ${abn?"on":""}" data-cntog>${abn?"異常":"正常"}</button>
        <span class="cn-lab">${escapeHtml(n.label)}</span>
      </div>
      <div class="cn-detail ${abn?"show":""}">
        ${gridHtml}${monoHtml}
        <textarea class="cn-note autogrow" rows="1" data-cnnote placeholder="其他描述（自由填寫）">${escapeHtml(st.note||"")}</textarea>
      </div>`;
    const get=()=>{ if(!v.cn[n.id])v.cn[n.id]={}; const s=v.cn[n.id]; if(!s.grid)s.grid={}; if(!s.mono)s.mono=[]; return s; };
    const detail=row.querySelector(".cn-detail");
    const tog=row.querySelector("[data-cntog]");
    tog.onclick=()=>{
      const s=get(); s.abn=!s.abn;
      if(!s.abn){ s.grid={}; s.mono=[]; s.note="";
        row.querySelectorAll(".cng-cell.on").forEach(c=>{c.classList.remove("on");c.textContent="";});
        row.querySelectorAll(".cn-chip.on").forEach(c=>c.classList.remove("on"));
        row.querySelector("[data-cnnote]").value=""; }
      tog.classList.toggle("on",s.abn); tog.textContent=s.abn?"異常":"正常";
      row.classList.toggle("abn",s.abn); detail.classList.toggle("show",s.abn);
      touch();
    };
    row.querySelectorAll("[data-cell]").forEach(c=>{
      c.onclick=()=>{ const s=get(); const key=c.getAttribute("data-cell");
        s.grid[key]=!s.grid[key]; c.classList.toggle("on",s.grid[key]); c.textContent=s.grid[key]?"✓":""; touch(); };
    });
    row.querySelectorAll("[data-cm]").forEach(b=>{
      b.onclick=()=>{ const s=get(); const m=b.getAttribute("data-cm");
        const i=s.mono.indexOf(m); if(i>=0)s.mono.splice(i,1); else s.mono.push(m);
        b.classList.toggle("on"); touch(); };
    });
    const note=row.querySelector("[data-cnnote]");
    note.addEventListener("input",()=>{ get().note=note.value; touch(); });
    panel.appendChild(row);
  });
  return panel;
}

function sensoryState(v){

function buildSensory(it,v){

/* =======================================================================
   匯出：文字模型 → TXT / PDF(列印)
   ======================================================================= */
function labelPlain(it){ return it.en ? `${it.en}（${it.label}）` : it.label; }

function fuParts(it,v){
  const parts=[];
  (it.fu||[]).forEach(f=>{
    const fv=(v.fu||{})[f.id];
    if(f.type==="toggle"){ if(fv==="1") parts.push(f.label+"(+)"); }
    else if(fv && String(fv).trim()){ parts.push(`${f.label}: ${fv}`); }
  });
  return parts;
}
function itemLine(it){
  const v=CUR.values[it.id]||{};
  let val="", pos=false;
  if(it.type==="toggle"){
    pos=!!v.on;
    val = pos?"(+) 陽性":"(−) 陰性";
    if(pos && it.fu){ const parts=fuParts(it,v); if(parts.length) val += "｜"+parts.join("；"); }
  }else if(it.type==="select"){
    val = v.sel || "未評估";
    pos = v.sel && v.sel!==it.normal;
    if(it.fu && v.sel===it.fuOn){ const parts=fuParts(it,v); if(parts.length) val += "｜"+parts.join("；"); }
    if(it.cnPanel){
      const cn=v.cn||{}; const parts=[];
      it.cnPanel.forEach(n=>{ const s=cn[n.id]; if(s&&s.abn){
        const seg=[];
        (n.sides||[]).forEach(sd=>{ const g=s.grid||{}; const sides=[g[sd.k+"_L"]?"L":"",g[sd.k+"_R"]?"R":""].filter(Boolean).join("/"); if(sides) seg.push(`${sd.l}(${sides})`); });
        (s.mono||[]).forEach(m=>seg.push(m));
        if(s.note&&s.note.trim()) seg.push(s.note.trim());
        parts.push(n.label+(seg.length?`：${seg.join("、")}`:"：異常")); } });
      if(parts.length){ val += "｜異常 → "+parts.join("；"); pos=true; }
    }
  }else if(it.type==="custom"){
    if(it.custom==="dtr"){
      const d=v.dtr||{}; const parts=[]; let any=false, abn=false;
      DTR_SITES.forEach(s=>{ const L=d[s.k+"_L"]||"", R=d[s.k+"_R"]||"";
        if(L||R){ any=true; parts.push(`${s.l.split(" ")[0]} L${L||"–"}/R${R||"–"}`); if((L&&L!=="2+")||(R&&R!=="2+"))abn=true; } });
      val = any? parts.join("；") : "未評估"; pos=abn;
    }else if(it.custom==="plantar"){
      const pl=v.plantar||{}; const L=pl.L||"未評估", R=pl.R||"未評估";
      val = `左 ${L} / 右 ${R}`;
      pos = (pl.L&&pl.L!==PLANTAR_OPTS[0])||(pl.R&&pl.R!==PLANTAR_OPTS[0]);
    }else if(it.custom==="sensory"){
      const s=v.sensory||{}; val=s.status||"未評估"; pos=s.status==="異常 Abnormal";
      if(pos && (s.findings||[]).length){
        const fs=(s.findings||[]).map((f,i)=>{const a=[f.side,f.change,(f.modalities||[]).join("/"),f.pattern,f.location].filter(Boolean);if(f.note&&f.note.trim())a.push("註："+f.note.trim());return `#${i+1} ${a.join("｜")||"未描述"}`;});
        val += "｜"+fs.join("；");
      }
    }
  }else if(it.type==="group"){
    const g=v.grp||{};
    const parts=it.fields.map(f=>`${f.label}${g[f.id]||"–"}`);
    let s=parts.join("");
    if(it.total && it.fields.every(f=>g[f.id])){
      const sum=it.fields.reduce((a,f)=>a+parseInt(g[f.id],10),0);
      s+=` (${sum})`;
    }
    val=s;
    pos=it.fields.some(f=>g[f.id] && g[f.id]!==f.normal);
  }else if(it.type==="text"){
    val = v.text && v.text.trim() ? v.text : "—";
    pos = v.text && v.text.trim();
  }
  const note = (v.note&&v.note.trim())?`　※${v.note.trim()}`:"";
  return {label:labelPlain(it), val, pos:!!pos, note, hasNote:!!(v.note&&v.note.trim())};
}

/* 建立匯出模型：limited=true 只留 Focus∪異常∪備註 */
function buildModel(limited){
  const p=CUR;
  const bn=p.blockNotes||{};
  const spec=SPEC_INDEX[p.specialty]||SPEC_INDEX.general;
  const focusIds=effectiveFocusIds(p,spec);
  const focusSet=new Set(focusIds);
  const alwaysKeys=new Set(["ros_const","pe_general"]); // 限縮版也整段匯出
  const out=[];

  lqqModels(p).forEach(m=>out.push(m)); // LQQOPERA 置最前，一律匯出
  const pom=postopModel(p); if(pom) out.push(pom); // 外科術後照護一律匯出
  const chm=chemoModel(p); if(chm) out.push(chm); // 化療／標靶副作用一律匯出
  infectionModels(p).forEach(m=>out.push(m)); // 感染／敗血症可多組套
  customSetsModel(p).forEach(m=>out.push(m)); // 自訂組套一律匯出

  out.push(admissionBlockModel(p)); // Admission 固定在 Focus 之前
  const pmhm=pmhModel(p); if(pmhm) out.push(pmhm); // PMH 固定在 Focus 之前
  if(focusIds.length){
    const fitems=focusIds.map(id=>ITEM_INDEX[id]&&ITEM_INDEX[id].item).filter(Boolean).filter(it=>itemVisible(it,p));
    const fRos=fitems.filter(it=>it.kind==="ROS");
    const fPe =fitems.filter(it=>it.kind==="PE");
    if(fRos.length||bn.focus_ros) out.push({title:"★ Focus ROS（重點問診）", note:bn.focus_ros||"", lines:fRos.map(itemLine)});
    if(fPe.length||bn.focus_pe)   out.push({title:"★ Focus PE（重點理學檢查）", note:bn.focus_pe||"", lines:fPe.map(itemLine)});
  }
  SECTIONS.forEach(sec=>{
    if(!sectionVisible(sec,p)) return;
    let items=sec.items.filter(it=>!focusSet.has(it.id));
    const always=alwaysKeys.has(sec.key);
    if(limited && !always) items=items.filter(it=>hasFinding(p,it));
    const note=bn[sec.key]||"";
    if(items.length===0 && !note) return;
    const f=flipLabel(sec.label);
    out.push({title:`${f.en}${f.zh?"（"+f.zh+"）":""} · ${sec.kind}`, note, lines:items.map(itemLine)});
  });
  return out;
}

function exportHeader(){
  const p=CUR;
  const spec=SPEC_INDEX[p.specialty]||SPEC_INDEX.general;
  const demo=[];
  if(p.sex) demo.push(p.sex);
  if(p.age) demo.push(p.age+(/^\d+$/.test(String(p.age))?" 歲":""));
  return {code:p.code, spec:spec.label, time:fmtTime(Date.now()),
    demo:demo.join(" · "), problem:(p.problem||"").trim()};
}

  L.push("查房紀錄 ROS / PE Rounding Note");

  if(h.demo) L.push(`基本資料：${h.demo}`);
  if(h.problem) L.push(`主要問題：${h.problem}`);
  L.push(`科別：${h.spec}`);
  L.push(`匯出時間：${h.time}`);
  L.push(limited?"（限縮版：重點＋陽性/異常＋備註）":"（完整版：全部項目）");
  L.push("".padEnd(40,"="));
  buildModel(limited).forEach(sec=>{
    L.push("");
    L.push(`【${sec.title}】`);
    if(sec.note) L.push(`  § 區塊備註：${sec.note}`);
    sec.lines.forEach(ln=>{
      L.push(`  ${ln.pos?"●":"○"} ${ln.label}：${ln.val}${ln.note}`);
    });
  });
  const gn=(CUR.globalNote||"").trim();
  L.push("");
  L.push("【其他備註 Additional notes】");
  L.push(gn?("  "+gn.split("\n").join("\n  ")):"  （無）");

  const todos=sortedTodos();
  L.push("");
  L.push("【待辦事項 To-do】");
  if(todos.length===0){ L.push("  （無）"); }
  else todos.forEach(t=>{
    const mark = t.status==="done"?"[✓完成]":"[待辦]";
    const imp = t.important?"★":"　";
    L.push(`  ${imp}${mark} ${t.text||"（未填）"}  (${fmtShort(t.createdAt)})`);
  });
  L.push("");
  L.push("".padEnd(40,"="));
  L.push("※ 本紀錄為臨床輔助草稿，請自行核對後再正式記載。");
  return L.join("\n");
}

function downloadText(filename,text){
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

/* 穩健列印：優先開新視窗（自帶內容），失敗才退回頁內列印 */
function robustPrint(limited){
  let w=null;
  try{ w=window.open("","_blank"); }catch(e){ w=null; }
  if(w && w.document){
    try{
      w.document.open(); w.document.write(printDocument(limited)); w.document.close();
      const go=()=>{ try{ w.focus(); w.print(); }catch(e){} };
      if(w.document.readyState==="complete") setTimeout(go,300);
      else w.onload=()=>setTimeout(go,250);
      return;
    }catch(e){ try{ w.close(); }catch(_){} }
  }
  const pa=$("#printArea");
  pa.innerHTML=buildPrintHtml(limited);
  const done=()=>{ pa.innerHTML=""; window.removeEventListener("afterprint",done); };
  window.addEventListener("afterprint",done);
  setTimeout(()=>{ try{ window.print(); }catch(e){} },80);
}

/* 複製全文（clipboard API，退回 execCommand） */
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallbackCopy(text));
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  try{
    const ta=document.createElement("textarea"); ta.value=text;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.focus(); ta.select(); const ok=document.execCommand("copy"); ta.remove(); return ok;
  }catch(e){ return false; }
}
